# Cargo.toml at repository root (virtual workspace)

[workspace]
members = ["crates/*", "docs/tests/integration"]
# `peppy-shared` is a sealed tree, not part of this workspace: it is a workspace
# of its own, resolving and locking on its own. The crates here depend on it by
# path (see `[workspace.dependencies]`); nothing inside it may depend on
# anything outside it, which is what lets `platform-backend` consume it from
# this repository without pulling in a line of `crates/`. The tree polices that
# itself (`peppy-shared/build-helpers/tests/sealed_tree.rs`), and CI runs its
# suites from a copy holding nothing but the tree.
exclude = ["peppy-shared"]
resolver = "3"

# Only build/test the main crates by default (integration tests are slow).
# Run integration tests explicitly with: cargo test -p docs-integration-tests
default-members = ["crates/*"]

[workspace.package]
version = "0.0.1"
authors = ["Tuatini Godard <tuatini@peppy.bot>"]
edition = "2024"
# The oldest compiler that builds the workspace. The code uses the language
# and the standard library of this release.
rust-version = "1.100"

[workspace.dependencies]
parking_lot = "0.13"
# The regex engine `repo search` compiles its query patterns with.
regex = "1"
# Parameterized tests: messaging e2e suites run each body under both peer and
# router mode via `#[case]` (see crates/*/tests). Test-only.
rstest = "0.28"
# The MCP client the endpoint e2e suites drive the built-in server with.
# Centralized because three crates depend on it and the version must match
# the one `peppy-mcp-runtime` builds its server side against; each use site
# adds its own features (the `server` feature only where the client
# capability builder is needed).
rmcp = { version = "3.5.1", default-features = false }

# Shared, public-facing crates from the sealed `peppy-shared` tree, consumed by
# path. The dependency runs one way only: these crates know nothing of
# `crates/`. `config` and `peppylib` are renamed via `package` (their crate
# names are `peppy-config-model` and `peppylib-rs`), and `pmi` is the package
# name of the `peppy-messaging-interface` directory.
# Per-crate features (e.g. `zenoh`, `fingerprint_test_helpers`, `git_fixtures`)
# are added at each use site with `{ workspace = true, features = [...] }`.
config = { path = "peppy-shared/peppy-config-model", package = "peppy-config-model" }
peppylib = { path = "peppy-shared/peppylib-rs", package = "peppylib-rs" }
pmi = { path = "peppy-shared/peppy-messaging-interface" }
core-node-api = { path = "peppy-shared/core-node-api" }
json5-pretty = { path = "peppy-shared/json5-pretty" }
config-test-support = { path = "peppy-shared/config-test-support" }
build-helpers = { path = "peppy-shared/build-helpers" }
peppy-mcp-catalog = { path = "peppy-shared/peppy-mcp-catalog" }
peppy-mcp-runtime = { path = "peppy-shared/peppy-mcp-runtime" }
peppy-codec = { path = "peppy-shared/peppy-codec" }

# Internal workspace crates (members under `crates/`). Centralized here so each
# member references them with `{ workspace = true }` instead of repeating a
# relative `path`; paths are resolved relative to this workspace root. Per-crate
# features are still added at the use site with `{ workspace = true, features = [...] }`.
auth = { path = "crates/auth-internal" }
containers = { path = "crates/containers-internal" }
core-node = { path = "crates/core-node-internal" }
daemon = { path = "crates/daemon-internal" }
daemon-config = { path = "crates/daemon-config-internal" }
encoding = { path = "crates/encoding-internal" }
generator = { path = "crates/generator-internal" }
mcp-test-support = { path = "crates/mcp-test-support" }
mcp-server = { path = "crates/mcp-server-internal" }
latency-report = { path = "crates/latency-report" }
log-export = { path = "crates/log-export-internal" }
node-stack = { path = "crates/node-stack-internal" }
oci-registry = { path = "crates/oci-registry-internal" }
peppylib-build-policy = { path = "crates/peppylib-build-policy" }
stack-goal = { path = "crates/stack-goal-internal" }

# The Rust practices that the code keeps to. Every member inherits these tables.
[workspace.lints.rust]
# The idiom lints of the 2018 edition, which include
# `elided_lifetimes_in_paths`: a type that borrows shows its lifetime.
rust_2018_idioms = { level = "warn", priority = -1 }
# A closure whose body is one async block is an async closure.
closure_returning_async_block = "warn"
# An `impl Trait` in return position captures every lifetime in scope.
impl_trait_redundant_captures = "warn"
# The prelude and a glob import bring a name in once, and a path names an item
# by the shortest form that the imports of its scope allow.
redundant_imports = "warn"
unused_qualifications = "warn"
# `pub` marks an item that the crate exports. An item that the crate keeps to
# itself is `pub(crate)` or narrower.
unreachable_pub = "warn"
# A type that the crate exports implements `Debug`, so a log line and a failed
# assertion can show it.
missing_debug_implementations = "warn"
# A cast is written only where it changes the type.
trivial_casts = "warn"
trivial_numeric_casts = "warn"
# A lifetime has a name only where two places must agree on it.
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
unused_lifetimes = "warn"
# An import list of one name has no braces, each rule of a macro has a use,
# and a macro comes in through a `use`.
macro_use_extern_crate = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"

[workspace.lints.clippy]
# The pedantic group: conversions that cannot lose a value without a word,
# patterns that name what they match, method references, borrowed parameters,
# early returns. The lints of the group that are set to "allow" below are the
# ones that the code does not keep to.
pedantic = { level = "warn", priority = -1 }
# `#[must_use]` is for a function whose ignored result is a defect, not for
# each function that returns a value.
must_use_candidate = "allow"
# The docs say when a function fails in the words of its error type. They have
# no `# Errors` and no `# Panics` heading.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# A count of lines, and two names that look alike, are not defects.
similar_names = "allow"
too_many_lines = "allow"
# An item that one statement uses is declared next to that statement.
items_after_statements = "allow"
# `assert!(x.is_empty())` stays: the replacement compares with a typed empty
# array.
assert_is_empty = "allow"
# An `async fn` of a trait implementation stays `async` when its body does not
# wait: its signature is the one of the trait.
unused_async_trait_impl = "allow"
# A field takes the default of its type through `Default::default()`.
default_trait_access = "allow"
# Short strings are joined with `map` and `collect`.
format_collect = "allow"

# A lint is expected, with its reason, so an attribute that silences nothing
# is reported. An inner `#![allow]` stays for code that a tool writes and for
# the helpers that test binaries share.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# `Self` names the type of an impl block, and `Arc::clone(&x)` shows that a
# clone copies a pointer. A value that has no later use moves.
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
use_self = "warn"
# A cast names its target type, and a type that can be `Eq` derives it.
as_underscore = "warn"
derive_partial_eq_without_eq = "warn"
# A pattern binds by reference through the match ergonomics, names the fields
# it skips with `..`, and compares with `==` where it binds nothing.
equatable_if_let = "warn"
ref_patterns = "warn"
unneeded_field_pattern = "warn"
# An `Option` chain that ends a function returns early with `?`, and a
# condition that picks `Some` or `None` is `bool::then`.
if_then_some_else_none = "warn"
return_and_then = "warn"
# A test unwraps the result it expects, so a failure shows the other variant.
# A discarded result is `let _ =`, and an index is `[i]`, not `get(i).unwrap()`.
assertions_on_result_states = "warn"
get_unwrap = "warn"
unused_result_ok = "warn"
# An empty struct or variant has no brackets, the module file of a directory
# sits beside the directory, and an import list has no lone `self`.
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
mod_module_files = "warn"
unnecessary_self_imports = "warn"
# An unsafe block says why it is sound, and only an unsafe block says so.
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
# Nothing that a debug session leaves behind.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
# Strip symbols + debuginfo from release artifacts. The peppylib Python extension
# (_peppylib.abi3.so) is built in release via maturin/PEP517; unstripped it was
# ~457 MB (full debug_info). uv caches that wheel per build (append-only cache),
# so unstripped builds ballooned ~/.cache/uv into the hundreds of GB. Stripping
# cuts the cdylib ~10-40x and also shrinks the wheels shipped to PyPI. Use
# strip = "debuginfo" instead if you need symbolized release backtraces.
strip = true
