# Cargo.toml at repository root (virtual workspace)

[workspace]
members = ["crates/*", "docs/tests/integration"]
resolver = "3"

# Only build/test the main crates by default (integration tests are slow).
# Run integration tests explicitly with: cargo test -p docs-integration-tests
default-members = ["crates/*"]

[workspace.package]
version = "0.0.1"
authors = ["Tuatini Godard <tuatini@peppy.bot>"]
edition = "2024"

# Optionally share common dependency versions across members (requires newer Cargo).
# This helps keep versions in sync without repeating them in each member's Cargo.toml.
# Uncomment and adapt as needed.
[workspace.dependencies]
parking_lot = "0.12"
# Parameterized tests: messaging e2e suites run each body under both peer and
# router mode via `#[case]` (see crates/*/tests). Test-only.
rstest = "0.26"

# Shared, public-facing crates consumed from the `public-peppy-libs` repo (the
# `peppyos-shared` virtual workspace) as git dependencies, so `peppyos` holds no
# path references outside its own tree. No `branch`/`tag`/`rev` is given, so each
# crate follows the repo's default branch (`main`); the resolved revision is
# recorded in Cargo.lock and moved forward with `cargo update`. `config` and
# `peppylib` are renamed via `package` (their crate names are `peppy-config-model`
# and `peppylib-rs`), and `pmi` is the package name of the `peppy-messaging-interface`
# directory. Per-crate features (e.g. `zenoh`, `fingerprint_test_helpers`,
# `git_fixtures`) are added at each use site with `{ workspace = true, features = [...] }`.
config = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "peppy-config-model" }
peppylib = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "peppylib-rs" }
pmi = { git = "https://github.com/Peppy-bot/public-peppy-libs" }
core-node-api = { git = "https://github.com/Peppy-bot/public-peppy-libs" }
json5-pretty = { git = "https://github.com/Peppy-bot/public-peppy-libs" }
config-test-support = { git = "https://github.com/Peppy-bot/public-peppy-libs" }
build-helpers = { git = "https://github.com/Peppy-bot/public-peppy-libs" }

# Internal workspace crates (members under `crates/`). Centralized here so each
# member references them with `{ workspace = true }` instead of repeating a
# relative `path`; paths are resolved relative to this workspace root. Per-crate
# features are still added at the use site with `{ workspace = true, features = [...] }`.
containers = { path = "crates/containers-internal" }
core-node = { path = "crates/core-node-internal" }
encoding = { path = "crates/encoding-internal" }
generator = { path = "crates/generator-internal" }
latency-report = { path = "crates/latency-report" }
node-stack = { path = "crates/node-stack-internal" }
peppylib-build-policy = { path = "crates/peppylib-build-policy" }

# Dev-only source override: build the `public-peppy-libs` git dependencies
# against the in-tree submodule checkout instead of the published `main` revision,
# so cross-repo changes to `pmi`/`peppylib` (e.g. the per-user-router TLS work) can
# be exercised from `peppyos` without a merge round-trip. ALL shared crates are
# redirected together — patching only a subset makes Cargo resolve a second copy of
# a transitively-shared crate (e.g. `core-node-api`) from git, which then fails to
# unify with the local one (type mismatch). Remove this block once the shared
# changes land on `main` and `cargo update` moves the lockfile forward.
[patch."https://github.com/Peppy-bot/public-peppy-libs"]
peppy-config-model = { path = "../public-peppy-libs/peppyos-shared/peppy-config-model" }
peppylib-rs = { path = "../public-peppy-libs/peppyos-shared/peppylib-rs" }
pmi = { path = "../public-peppy-libs/peppyos-shared/peppy-messaging-interface" }
core-node-api = { path = "../public-peppy-libs/peppyos-shared/core-node-api" }
json5-pretty = { path = "../public-peppy-libs/peppyos-shared/json5-pretty" }
config-test-support = { path = "../public-peppy-libs/peppyos-shared/config-test-support" }
build-helpers = { path = "../public-peppy-libs/peppyos-shared/build-helpers" }

# Optionally define workspace-wide lints or profiles.
# [workspace.lints.rust]
# unused_extern_crates = "deny"

# [workspace.profile.dev]
# opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
# Strip symbols + debuginfo from release artifacts. The peppylib Python extension
# (_peppylib.abi3.so) is built in release via maturin/PEP517; unstripped it was
# ~457 MB (full debug_info). uv caches that wheel per build (append-only cache),
# so unstripped builds ballooned ~/.cache/uv into the hundreds of GB. Stripping
# cuts the cdylib ~10-40x and also shrinks the wheels shipped to PyPI. Use
# strip = "debuginfo" instead if you need symbolized release backtraces.
strip = true
