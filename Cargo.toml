# Cargo.toml at repository root (virtual workspace)

[workspace]
members = ["crates/*", "docs/tests/integration"]

# Those ones are examples that use user facing libraries as if they were uploaded to crates.io
exclude = ["crates/peppylib/examples/*"]
resolver = "3"

# Only build/test the main crates by default (integration tests are slow).
# Run integration tests explicitly with: cargo test -p docs-integration-tests
default-members = [
  "crates/build-helpers-internal",
  "crates/config-internal",
  "crates/containers-internal",
  "crates/core-node-internal",
  "crates/generator-internal",
  "crates/node-stack-internal",
  "crates/peppy",
  "crates/peppylib",
  "crates/peppylib-py",
  "crates/pmi-internal",
]

[workspace.package]
version = "0.0.1"
authors = ["Tuatini Godard <tuatini@peppy.bot>"]
edition = "2024"

# Optionally share common dependency versions across members (requires newer Cargo).
# This helps keep versions in sync without repeating them in each member's Cargo.toml.
# Uncomment and adapt as needed.
# [workspace.dependencies]
# anyhow = "1.0"
# thiserror = "1.0"
# serde = { version = "1.0", features = ["derive"] }
# pyo3 = { version = "0.28", features = ["extension-module"] }

# Optionally define workspace-wide lints or profiles.
# [workspace.lints.rust]
# unused_extern_crates = "deny"

# [workspace.profile.dev]
# opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
