# Cargo.toml at repository root (virtual workspace)

[workspace]
members = ["crates/*", "docs/tests/integration"]
# `public-peppy-libs` is a sealed tree, not part of this workspace: it holds
# its own workspace (`peppy-shared`) and standalone packages, each resolving
# and locking on its own. The crates here depend on it by path (see
# `[workspace.dependencies]`); nothing inside it may depend on anything outside
# it, which is what lets `platform-backend` and the hub nodes consume it from
# this repository without pulling in a line of `crates/`. The tree polices that
# itself (`public-peppy-libs/peppy-shared/build-helpers/tests/sealed_tree.rs`),
# and CI runs its suites from a copy holding nothing but the tree.
exclude = ["public-peppy-libs"]
resolver = "3"

# Only build/test the main crates by default (integration tests are slow).
# Run integration tests explicitly with: cargo test -p docs-integration-tests
default-members = ["crates/*"]

[workspace.package]
version = "0.0.1"
authors = ["Tuatini Godard <tuatini@peppy.bot>"]
edition = "2024"

# Optionally share common dependency versions across members (requires newer Cargo).
# This helps keep versions in sync without repeating them in each member's Cargo.toml.
# Uncomment and adapt as needed.
[workspace.dependencies]
parking_lot = "0.12"
# The regex engine `repo search` compiles its query patterns with.
regex = "1"
# Parameterized tests: messaging e2e suites run each body under both peer and
# router mode via `#[case]` (see crates/*/tests). Test-only.
rstest = "0.27"
# The MCP client the endpoint e2e suites drive the built-in server with.
# Centralized because three crates depend on it and the version must match
# the one `peppy-mcp-runtime` builds its server side against; each use site
# adds its own features (the `server` feature only where the client
# capability builder is needed).
rmcp = { version = "3.1.2", default-features = false }

# Shared, public-facing crates from the sealed `public-peppy-libs` tree (its
# `peppy-shared` workspace), consumed by path. The dependency runs one way only:
# these crates know nothing of `crates/`. `config` and `peppylib` are renamed via
# `package` (their crate names are `peppy-config-model` and `peppylib-rs`), and
# `pmi` is the package name of the `peppy-messaging-interface` directory.
# Per-crate features (e.g. `zenoh`, `fingerprint_test_helpers`, `git_fixtures`)
# are added at each use site with `{ workspace = true, features = [...] }`.
config = { path = "public-peppy-libs/peppy-shared/peppy-config-model", package = "peppy-config-model" }
peppylib = { path = "public-peppy-libs/peppy-shared/peppylib-rs", package = "peppylib-rs" }
pmi = { path = "public-peppy-libs/peppy-shared/peppy-messaging-interface" }
core-node-api = { path = "public-peppy-libs/peppy-shared/core-node-api" }
json5-pretty = { path = "public-peppy-libs/peppy-shared/json5-pretty" }
config-test-support = { path = "public-peppy-libs/peppy-shared/config-test-support" }
build-helpers = { path = "public-peppy-libs/peppy-shared/build-helpers" }
peppy-mcp-catalog = { path = "public-peppy-libs/peppy-shared/peppy-mcp-catalog" }
peppy-mcp-runtime = { path = "public-peppy-libs/peppy-shared/peppy-mcp-runtime" }

# Internal workspace crates (members under `crates/`). Centralized here so each
# member references them with `{ workspace = true }` instead of repeating a
# relative `path`; paths are resolved relative to this workspace root. Per-crate
# features are still added at the use site with `{ workspace = true, features = [...] }`.
auth = { path = "crates/auth-internal" }
containers = { path = "crates/containers-internal" }
core-node = { path = "crates/core-node-internal" }
daemon = { path = "crates/daemon-internal" }
daemon-config = { path = "crates/daemon-config-internal" }
encoding = { path = "crates/encoding-internal" }
generator = { path = "crates/generator-internal" }
mcp-test-support = { path = "crates/mcp-test-support" }
message-codec = { path = "crates/message-codec-internal" }
mcp-server = { path = "crates/mcp-server-internal" }
latency-report = { path = "crates/latency-report" }
node-stack = { path = "crates/node-stack-internal" }
peppylib-build-policy = { path = "crates/peppylib-build-policy" }

# Optionally define workspace-wide lints or profiles.
# [workspace.lints.rust]
# unused_extern_crates = "deny"

# [workspace.profile.dev]
# opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
# Strip symbols + debuginfo from release artifacts. The peppylib Python extension
# (_peppylib.abi3.so) is built in release via maturin/PEP517; unstripped it was
# ~457 MB (full debug_info). uv caches that wheel per build (append-only cache),
# so unstripped builds ballooned ~/.cache/uv into the hundreds of GB. Stripping
# cuts the cdylib ~10-40x and also shrinks the wheels shipped to PyPI. Use
# strip = "debuginfo" instead if you need symbolized release backtraces.
strip = true
