[package]
name = "core-node-api"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
# This is the only crate that is allowed to be imported to avoid future circular dependencies
# `config` stays in the peppy workspace (shared by many peppy crates); reach it
# via a reverse path, the same way peppylib-rs does.
config = { package = "peppy-config-model", path = "../peppy-config-model" }
# `unaligned`: messages are decoded in place from the transport's buffer,
# which carries no alignment guarantee.
capnp = { version = "0.27", features = ["unaligned"] }
bytes = "1.10"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json5 = "0.2"
thiserror = "2.0"
url = "2"
gix-url = "0.38"

[build-dependencies]
build-helpers = { path = "../build-helpers" }
capnpc = "0.27"

[dev-dependencies]
tempfile = "3.10"
# Matches the codec the daemon uses for `graph_json` on the wire, so the
# graph round-trip tests exercise the real serialization path.
serde_json = "1.0"
