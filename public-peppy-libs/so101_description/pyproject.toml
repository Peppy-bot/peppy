[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "so101_description"
version = "0.1.0"
description = "The SO-101's identity for its peppy nodes: joint and motor names, wire-unit conversions, limb-name vocabulary, named postures, setpoint parsing shaped by the STS3215's constraints, and the embedded URDF with its limits, kinematics, and pose transforms. openarm_description's sibling for the lerobot SO-ARM family."
requires-python = ">=3.12,<3.14"
dependencies = ["control_core_py", "numpy>=1.26"]

[project.optional-dependencies]
# The kinematics module wraps lerobot's placo solver; hardware-only
# consumers skip the extra and the solver stack with it.
kinematics = ["lerobot[kinematics]>=0.6,<0.7"]

[tool.uv.sources]
control_core_py = { path = "../control_core_py" }

[tool.hatch.build.targets.wheel]
packages = ["src/so101_description"]

[dependency-groups]
dev = ["pytest>=8", "lerobot[kinematics]>=0.6,<0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
