[package]
name = "auth"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
config = { workspace = true }
daemon-config = { workspace = true }
federation-identity = { workspace = true }
json5-pretty = { workspace = true }
pmi = { workspace = true, features = ["zenoh"] }
rustix = { version = "1", features = ["process"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json5 = "0.2"
thiserror = "2.0"
tracing = "0.1"
ureq = { version = "3.1", features = ["platform-verifier"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
httpmock = "0.8"
pem = "3"
rand = "0.8"
rcgen = "0.14"
rsa = "0.9"
tempfile = "3.8"
time = { version = "0.3", features = ["formatting", "parsing"] }
x509-parser = { version = "0.18", features = ["verify"] }
