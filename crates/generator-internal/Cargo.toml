[package]
name = "generator"
version.workspace = true
authors.workspace = true
edition.workspace = true

[features]
# In a debug build, rust-embed does not embed: each `#[folder]` is read from
# the filesystem at runtime, at the absolute path recorded when the crate was
# compiled. That is a deliberate convenience for editing templates without a
# rebuild, and it holds only while the build tree is still there. Anywhere it
# is not, every template read fails with a bare `No such file or directory`.
#
# The multi-daemon e2e test is exactly that: it mounts a debug-built `peppy`
# into a container that carries no repository, so `node add` cannot reach a
# single peppygen template. Turning this on makes a debug build embed for real,
# which is what a release build does unconditionally.
debug-embed = ["rust-embed/debug-embed"]

[dependencies]
pmi = { workspace = true }
config = { workspace = true }
daemon-config = { workspace = true }
encoding = { workspace = true }
quote = "1.0"
proc-macro2 = "1.0"
prettyplease = "0.3"
syn = { version = "3.0", features = ["full"] }
thiserror = "2"
askama = "0.16"
toml = "1"
toml_edit = "0.25"
indexmap = "2.2"
rust-embed = { version = "8", features = ["include-exclude", "interpolate-folder-path"] }
sha2 = "0.11"

[build-dependencies]
build-helpers = { workspace = true }
peppylib-build-policy = { workspace = true }
sha2 = "0.11"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
bytes = "1"
config = { workspace = true, features = ["fingerprint_test_helpers"] }
# Only the pure-std helpers (`assert_contains_all`, `test_tmp_root`) are used, so
# no `git_fixtures` feature: keeps libgit2 out of the generator test build.
config-test-support = { workspace = true }
json5-pretty = { workspace = true }
pmi = { workspace = true, features = ["zenoh", "build_zenoh"] }
serde_json5 = "0.2.1"
tempfile = "3.10"
# Lets the scaffold test gate itself on the same PEPPY_CROSS_BUILD predicate the
# build script uses, so the two never drift.
peppylib-build-policy = { workspace = true }
peppylib = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
rstest = { workspace = true }
