[package]
name = "generator"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
pmi = { path = "../pmi-internal" }
config = { path = "../config-internal" }
quote = "1.0"
proc-macro2 = "1.0"
prettyplease = "0.2"
syn = { version = "2.0", features = ["full"] }
thiserror = "2.0"
askama = "0.14.0"
toml = "0.9"
sha2 = "0.10"
capnp = "0.23"
indexmap = "2.2"
names-generator2 = "0.2"

[dev-dependencies]
serde_json5 = "0.2.1"
tempfile = "3.10"
peppylib = { path = "../peppylib", features = ["test-support"] }
tokio = { version = "1.47.0", features = ["macros", "rt-multi-thread"] }
