[package]
name = "generator"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
pmi = { path = "../../../nodes_shared_code/peppyos-shared/peppy-messaging-interface" }
config = { path = "../../../nodes_shared_code/peppyos-shared/config-internal" }
encoding = { path = "../encoding-internal" }
quote = "1.0"
proc-macro2 = "1.0"
prettyplease = "0.2"
syn = { version = "2.0", features = ["full"] }
thiserror = "2"
askama = "0.16"
toml = "1"
toml_edit = "0.25"
indexmap = "2.2"
rust-embed = { version = "8", features = ["include-exclude"] }

[build-dependencies]
build-helpers = { path = "../../../nodes_shared_code/peppyos-shared/build-helpers-internal" }
peppylib-build-policy = { path = "../peppylib-build-policy" }
sha2 = "0.11"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
bytes = "1"
config = { path = "../../../nodes_shared_code/peppyos-shared/config-internal", features = ["fingerprint_test_helpers"] }
# Only the pure-std helpers (`assert_contains_all`, `test_tmp_root`) are used, so
# no `git_fixtures` feature — keeps libgit2 out of the generator test build.
config-test-support = { path = "../../../nodes_shared_code/peppyos-shared/config-test-support-internal" }
json5-pretty = { path = "../../../nodes_shared_code/peppyos-shared/json5-pretty" }
pmi = { path = "../../../nodes_shared_code/peppyos-shared/peppy-messaging-interface", features = ["zenoh", "build_zenoh"] }
serde_json5 = "0.2.1"
tempfile = "3.10"
peppylib = { package = "peppylib-rs", path = "../../../nodes_shared_code/peppyos-shared/peppylib-rs" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
rstest = { workspace = true }
