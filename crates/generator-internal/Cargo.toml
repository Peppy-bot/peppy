[package]
name = "generator"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
pmi = { path = "../pmi-internal" }
config = { path = "../config-internal" }
quote = "1.0"
proc-macro2 = "1.0"
prettyplease = "0.2"
syn = { version = "2.0", features = ["full"] }
thiserror = "2"
askama = "0.16"
toml = "1"
toml_edit = "0.25"
indexmap = "2.2"
rust-embed = { version = "8", features = ["include-exclude"] }

[build-dependencies]
build-helpers = { path = "../build-helpers-internal" }
sha2 = "0.11"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
bytes = "1"
config = { path = "../config-internal", features = ["test_helpers"] }
pmi = { path = "../pmi-internal", features = ["zenoh", "build_zenoh"] }
latency-report = { path = "../latency-report" }
serde_json5 = "0.2.1"
tempfile = "3.10"
peppylib = { path = "../peppylib" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

# Roundtrip latency benchmark: spins up two real peppy nodes (a Rust driver +
# a Rust or Python responder), measures topic/service roundtrip latency, and
# prints a summary table comparing the median (p50) against the previous run on
# this machine.
# Self-contained (no libtest harness); run with:
#   cargo bench -p generator --bench latency
# The matching threshold guard lives in tests/latency.rs (ignored by default).
[[bench]]
name = "latency"
harness = false
# Keep `cargo test` from building/running this bench (it spawns real nodes); it
# is exercised only by `cargo bench` and the dedicated dev->main latency.yml.
test = false
