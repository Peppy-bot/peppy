[package]
name = "config"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json5 = "0.2"
tracing = "0.1.41"
proc-macro2 = "1.0"
walkdir = "2.5"
askama = { version = "0.15", optional = true }
capnp = "0.25"
capnpc = "0.25"
sha2 = "0.10"
tempfile = "3.8"
indexmap = { version = "2.2", features = ["serde"] }
git2 = { version = "0.20", optional = true }
dirs = "6"

[dev-dependencies]

[features]
default = ["node-create"]
node-create = ["askama"]
test_helpers = ["askama", "git2"]
