[package]
name = "core-node"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
pmi = { workspace = true, features = ["zenoh", "build_zenoh"] }
config = { workspace = true, features = ["atomic_write"] }
daemon-config = { workspace = true }
log-export = { workspace = true }
node-stack = { workspace = true }
peppylib = { workspace = true }
core-node-api = { workspace = true }
generator = { workspace = true }
latency-report = { workspace = true }
containers = { workspace = true }
json5-pretty = { workspace = true }
# The catalog derivation the built-in MCP server serves from and the hub
# check validates with; the daemon derives it when it registers the server
# and when `peppy mcp catalog` asks.
peppy-mcp-catalog = { workspace = true }
# The run-time codec the daemon reads and writes the messages of its daemon
# interfaces with, from their compiled-in documents, and the parser of
# contract documents, which the node sync, the repository index and the MCP
# checks read pinned contracts with.
peppy-codec = { workspace = true }
# The goal path the provider of `robot_membership:v1` sends its stack changes to
# its own daemon on.
stack-goal = { workspace = true }
bytes = "1.10"
chrono = "0.4"
hostname = "0.4"
machine-uid = "0.6"
futures = "0.3"
names-generator2 = "0.3.0"
rand = "0.10"
regex = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json5 = "0.2"
sysinfo = "0.39"
thiserror = "2.0"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "sync",
    "rt",
    "time",
] }
tokio-util = "0.7"
tracing = "0.1"
askama = "0.16"
rust-embed = { version = "8", features = ["include-exclude"] }
gix-url = "0.39"
git2 = { version = "0.21", features = ["https", "ssh", "vendored-openssl"] }
url = "2"
ureq = "3.1"
tar = "0.4"
zstd = "0.14"
tempfile = "3.10"
sha2 = "0.11"
parking_lot = { workspace = true }
auth = { workspace = true }
dirs = "7"
ignore = "0.4"
# `getifaddrs`, for the host addresses an instance's endpoints expand to.
nix = { version = "0.31", default-features = false, features = ["net"] }
# Only for the `test-support` log-capture helpers; the daemon's own tracing
# setup lives in the binary crate.
tracing-subscriber = { version = "0.3", optional = true }

[build-dependencies]
build-helpers = { workspace = true }

[dev-dependencies]
# This crate dev-depends on itself to turn `test-support` on for its
# integration tests: the restart backoffs the CLI tier shares, and the slice
# ownership a test reserves and changes the stack through.
core-node = { path = ".", features = ["test-support"] }
# node-stack's test support (the log file readers, the slot's `supervision`,
# `FirstStart::fixture` and the process-group probes), and the records a test
# exporter queued.
node-stack = { workspace = true, features = ["test-support"] }
log-export = { workspace = true, features = ["test-support"] }
config = { workspace = true, features = ["fingerprint_test_helpers"] }
# git_fixtures: this crate's tests use the libgit2-backed `create_nodes_git_repo`.
config-test-support = { workspace = true, features = ["git_fixtures"] }
tempfile = "3.10"
tokio = { version = "1", features = ["full", "test-util"] }
# `peppylib::testing`: the ephemeral router and the mock cores of the unit
# tests of the daemon interfaces, which stand in for the daemon's own stack
# goals.
peppylib = { workspace = true, features = ["testing"] }
rstest = { workspace = true }
httptest = "0.16.3"
tracing-subscriber = "0.3"
# `PackagesBaseUrl::loopback_http_for_tests`: the PyPI mirror of the build
# tests is an `httptest` server on loopback.
daemon-config = { workspace = true, features = ["test-support"] }
# The test CA that mints the machine certificates of the tests of the calls of
# other machines.
auth = { workspace = true, features = ["test-support"] }

[features]
container_e2e = []
# Embed this crate's node-init templates, and the generator's, even in a debug
# build. Needed by any test that runs a debug binary away from its build tree;
# see the feature's own comment in generator-internal.
debug-embed = ["rust-embed/debug-embed", "generator/debug-embed"]
# For tests, this crate's and downstream crates': the `test_support` module,
# `CoreNode::slice_ownership`, `SliceOwnership::stack`,
# `SliceOwnership::restart_waits_for_admission` and the
# `ReserveOutcome` and `SliceOwnership` re-exports; this crate's own unit
# tests see them via `cfg(test)`.
test-support = ["dep:tracing-subscriber"]

# Roundtrip latency benchmark: spins up two real peppy nodes (a Rust driver +
# a Rust or Python responder), measures topic/service roundtrip latency, and
# prints a summary table comparing the median (p50) against the previous run on
# this machine. The node codegen + build + spawn scaffolding is reused
# cross-crate from generator-internal/tests/helpers.rs.
# Self-contained (no libtest harness); run with:
#   cargo bench -p core-node --bench latency
# The matching threshold guard lives in tests/latency.rs (ignored by default).
[[bench]]
name = "latency"
harness = false
# Keep `cargo test` from building/running this bench (it spawns real nodes); it
# is exercised only by `cargo bench` and the dedicated dev->main latency.yml.
test = false
