[package]
name = "core-node"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
pmi = { path = "../../../nodes_shared_code/peppyos-shared/pmi-internal", features = ["zenoh", "build_zenoh"] }
config = { path = "../../../nodes_shared_code/peppyos-shared/config-internal" }
node-stack = { path = "../node-stack-internal" }
peppylib = { package = "peppylib-rs", path = "../../../nodes_shared_code/peppyos-shared/peppylib-rs" }
core-node-api = { path = "../../../nodes_shared_code/peppyos-shared/core-node-api" }
generator = { path = "../generator-internal" }
latency-report = { path = "../latency-report" }
containers = { path = "../containers-internal" }
json5-pretty = { path = "../json5-pretty" }
bytes = "1.10"
chrono = "0.4"
hostname = "0.4"
machine-uid = "0.6"
futures = "0.3"
names-generator2 = "0.2.1"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json5 = "0.2"
sysinfo = "0.39"
thiserror = "2.0"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "sync",
    "rt",
    "time",
] }
tokio-util = "0.7"
tracing = "0.1"
askama = "0.16"
rust-embed = { version = "8", features = ["include-exclude"] }
gix-url = "0.36"
git2 = { version = "0.21", features = ["https", "vendored-openssl"] }
url = "2"
ureq = "3.1"
tar = "0.4"
zstd = "0.13.3"
tempfile = "3.10"
sha2 = "0.11"
parking_lot = { workspace = true }
dirs = "6"
ignore = "0.4"
# Safe wrapper for the process-group SIGKILL in node teardown (replaces a raw
# `libc::kill` FFI call), letting the crate adopt `#![forbid(unsafe_code)]`.
nix = { version = "0.31", default-features = false, features = ["signal"] }

[build-dependencies]
build-helpers = { path = "../../../nodes_shared_code/peppyos-shared/build-helpers-internal" }

[dev-dependencies]
node-stack = { path = "../node-stack-internal" }
config = { path = "../../../nodes_shared_code/peppyos-shared/config-internal", features = ["test_helpers"] }
tempfile = "3.10"
tokio = { version = "1", features = ["full", "test-util"] }
rstest = { workspace = true }
httptest = "0.16.3"

[features]
container_e2e = []

# Roundtrip latency benchmark: spins up two real peppy nodes (a Rust driver +
# a Rust or Python responder), measures topic/service roundtrip latency, and
# prints a summary table comparing the median (p50) against the previous run on
# this machine. The node codegen + build + spawn scaffolding is reused
# cross-crate from generator-internal/tests/helpers.rs.
# Self-contained (no libtest harness); run with:
#   cargo bench -p core-node --bench latency
# The matching threshold guard lives in tests/latency.rs (ignored by default).
[[bench]]
name = "latency"
harness = false
# Keep `cargo test` from building/running this bench (it spawns real nodes); it
# is exercised only by `cargo bench` and the dedicated dev->main latency.yml.
test = false
