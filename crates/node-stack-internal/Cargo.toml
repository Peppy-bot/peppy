[package]
name = "node-stack"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
config = { workspace = true }
daemon-config = { workspace = true }
containers = { workspace = true }
core-node-api = { workspace = true }
petgraph = "0.8.3"
thiserror = "2.0"
rand = "0.10"
names-generator2 = "0.2.1"
tokio = { version = "1", features = [
    "io-util",
    "process",
    "sync",
    "rt",
    "time",
    "macros",
] }
tokio-util = "0.7"
tar = "0.4"
zstd = "0.13.3"
chrono = "0.4"
tracing = "0.1"
parking_lot = { workspace = true }
tempfile = "3.10"
process-wrap = { version = "9.1.0", features = ["tokio1", "process-group"] }


[dev-dependencies]
serde_json5 = "0.2.1"
