[package]
name = "node-stack"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
config = { path = "../config-internal", features = ["test_helpers"] }
containers = { path = "../containers-internal" }
petgraph = "0.8.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
rand = "0.10"
names-generator2 = "0.2.1"
tokio = { version = "1.47", features = ["io-util", "process", "sync", "rt", "time", "macros"] }
tar = "0.4"
zstd = "0.13.3"
chrono = "0.4"
tracing = "0.1"


[features]
# Exposes the `NodeEntity::__test_set_stage` escape hatch and other test
# fixtures so that consumer crates can drive lifecycle stages directly in
# their own test suites without going through `build`/`prepare_and_spawn`.
test_helpers = []

[dev-dependencies]
node-stack = { path = ".", features = ["test_helpers"] }
serde_json5 = "0.2.1"
tempfile = "3.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
