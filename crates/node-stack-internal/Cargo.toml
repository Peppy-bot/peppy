[package]
name = "node-stack"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
config = { workspace = true }
daemon-config = { workspace = true }
containers = { workspace = true }
core-node-api = { workspace = true }
log-export = { workspace = true }
petgraph = "0.8.3"
thiserror = "2.0"
rand = "0.10"
names-generator2 = "0.3.0"
tokio = { version = "1", features = [
    "io-util",
    "process",
    "sync",
    "rt",
    "time",
    "macros",
] }
tokio-util = "0.7"
tar = "0.4"
zstd = "0.14"
# Fingerprints the staged node tree that keys the build artifact cache.
sha2 = "0.11"
chrono = "0.4"
tracing = "0.1"
parking_lot = { workspace = true }
tempfile = "3.10"
# A built-in instance's endpoints are read off the runtime config it boots
# with, which travels as JSON5.
serde_json5 = "0.2"
process-wrap = { version = "10.0.0", features = ["tokio1", "process-group"] }
# Safe wrapper for the process-group signals (`killpg`) the stack sends its
# children, keeping the crate free of `unsafe`.
nix = { version = "0.31", default-features = false, features = ["signal"] }
# The PyPI mirror of Python builds: `toml_edit` rewrites the URLs of a
# staged uv.lock and keeps the rest of the file as it is, `reqwest` asks the
# mirror which locked files it has, and `futures` keeps a bounded number of
# those requests in flight. Like uv, the requests go through the proxy that
# ALL_PROXY, HTTPS_PROXY or HTTP_PROXY of the daemon names and skip the hosts
# of NO_PROXY; `socks` lets that proxy be a SOCKS one.
toml_edit = "0.25"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "socks"] }
futures = "0.3"


[dev-dependencies]
serde_json5 = "0.2.1"
# `mkfifo` and `geteuid` for the build artifact cache fingerprint tests.
nix = { version = "0.31", default-features = false, features = ["fs", "user"] }
# `start_paused` virtual-clock tests for the build progress monitor, and the
# loopback cargo registry of the cargo progress test.
tokio = { version = "1", features = ["test-util", "net"] }
# Gzips the `.crate` archive the loopback cargo registry serves.
flate2 = "1"
# The PyPI mirror the presence check and the build-flow tests ask, and the
# loopback packages base URL that points at it.
httpmock = "0.8"
daemon-config = { workspace = true, features = ["test-support"] }
# `drain_records`, which reads what a test log exported.
log-export = { workspace = true, features = ["test-support"] }

[features]
# `action_log::test_support`, the readers of the log file format, for the
# tests of downstream crates.
test-support = []
