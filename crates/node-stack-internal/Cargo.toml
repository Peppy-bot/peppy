[package]
name = "node-stack"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
config = { workspace = true }
daemon-config = { workspace = true }
containers = { workspace = true }
core-node-api = { workspace = true }
petgraph = "0.8.3"
thiserror = "2.0"
rand = "0.10"
names-generator2 = "0.2.1"
tokio = { version = "1", features = [
    "io-util",
    "process",
    "sync",
    "rt",
    "time",
    "macros",
] }
tokio-util = "0.7"
tar = "0.4"
zstd = "0.13.3"
chrono = "0.4"
tracing = "0.1"
parking_lot = { workspace = true }
tempfile = "3.10"
# A built-in instance's endpoints are read off the runtime config it boots
# with, which travels as JSON5.
serde_json5 = "0.2"
process-wrap = { version = "10.0.0", features = ["tokio1", "process-group"] }
# Safe wrapper for the process-group signals (`killpg`) the stack sends its
# children, keeping the crate free of `unsafe`.
nix = { version = "0.31", default-features = false, features = ["signal"] }


[dev-dependencies]
serde_json5 = "0.2.1"
# `start_paused` virtual-clock tests for the build progress monitor.
tokio = { version = "1", features = ["test-util"] }
