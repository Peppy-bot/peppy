[package]
name = "node-stack"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
config = { package = "peppy-config-model", path = "../../../nodes_shared_code/peppyos-shared/peppy-config-model" }
containers = { path = "../containers-internal" }
core-node-api = { path = "../../../nodes_shared_code/peppyos-shared/core-node-api" }
petgraph = "0.8.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
rand = "0.10"
names-generator2 = "0.2.1"
tokio = { version = "1", features = [
    "io-util",
    "process",
    "sync",
    "rt",
    "time",
    "macros",
] }
tokio-util = "0.7"
tar = "0.4"
zstd = "0.13.3"
chrono = "0.4"
tracing = "0.1"
parking_lot = { workspace = true }
tempfile = "3.10"
process-wrap = { version = "9.1.0", features = ["tokio1", "process-group"] }


[dev-dependencies]
serde_json5 = "0.2.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
