[package]
name = "node-stack"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
config = { path = "../config-internal" }
git2 = "0.20"
petgraph = "0.8.3"
thiserror = "2.0"
zstd = "0.13.3"
tar = "0.4"
sha2 = "0.10"
ureq = { version = "2.10", features = ["tls", "gzip"] }
httptest = "0.16.3"


[dev-dependencies]
askama = "0.14.0"
serde_json5 = "0.2.1"
tempfile = "3.10"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
