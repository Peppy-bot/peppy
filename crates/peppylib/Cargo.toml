[package]
name = "peppylib"
version.workspace = true
edition.workspace = true
homepage = "https://dev.peppy.bot"
description = "The peppyOS control library"
license = "MIT OR Apache-2.0"
readme = "Readme.md"

[dependencies]
pmi = { path = "../pmi-internal" }
config = { path = "../config-internal" }
node-stack = { path = "../node-stack-internal" }
thiserror = "2.0"                                   # Avoid Anyhow in this crate
tokio = { version = "1.47.0", features = ["full"] }
tracing = "0.1.41"
bytes = "1"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json5 = "0.2"
serde_json = "1.0"
tempfile = { version = "3.10", optional = true }
md5 = "0.8"
capnp = "0.24"

[build-dependencies]
capnpc = "0.24"

[dev-dependencies]
tempfile = "3.10"
askama = "0.15"
tokio = { version = "1.47.0", features = ["full"] }
rand = "0.9"
regex = "1"

[features]
default = ["zenoh"]
zenoh = ["pmi/zenoh"]
test-support = ["tempfile", "zenoh"]
