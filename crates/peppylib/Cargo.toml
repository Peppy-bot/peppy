[package]
name = "peppylib"
version.workspace = true
edition.workspace = true
homepage = "https://dev.peppy.bot"
description = "The peppyOS control library"
license = "MIT OR Apache-2.0"
readme = "Readme.md"

[dependencies]
pmi = { path = "../pmi-internal" }
config = { path = "../config-internal" }
thiserror = "2.0"                                   # Avoid Anyhow in this crate
tokio = { version = "1.47.0", features = ["full"] }
tracing = "0.1.41"
bytes = "1"
futures = "0.3"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json5 = "0.2"
serde_json = "1.0"
schemars = "1.2"
schemars_derive = "1.2"
jsonschema = "0.41"
tokio-util = "0.7"
tempfile = { version = "3.10", optional = true }
capnp = "0.25"

[build-dependencies]
capnpc = "0.25"

[dev-dependencies]
tempfile = "3.10"
askama = "0.15"
tokio = { version = "1.47.0", features = ["full"] }
tokio-util = "0.7"
rand = "0.10"
regex = "1"
config = { path = "../config-internal", features = ["test_helpers"] }

[features]
default = ["zenoh"]
zenoh = ["pmi/zenoh"]
