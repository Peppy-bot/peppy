[package]
name = "master-node"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
pmi = { path = "../pmi-internal", features = ["zenoh"] }
config = { path = "../config-internal" }
node-stack = { path = "../node-stack-internal" }
peppylib = { path = "../peppylib" }
generator = { path = "../generator-internal" }
bytes = "1.10"
chrono = "0.4"
hostname = "0.4"
capnp = "0.25"
futures = "0.3"
names-generator2 = "0.2.0"
rand = "0.9"
serde_json = "1.0"
serde_json5 = "0.2"
sysinfo = "0.37"
thiserror = "2.0"
tokio = { version = "1.47", features = [
    "io-util",
    "process",
    "sync",
    "rt",
    "time",
] }
tracing = "0.1"
askama = "0.15"
rust-embed = { version = "8", features = ["include-exclude"] }
gix-url = "0.35"
git2 = "0.20"
url = "2"
ureq = "3.1"
tar = "0.4"
zstd = "0.13.3"
tempfile = "3.10"

[build-dependencies]
capnpc = "0.25"

[dev-dependencies]
libc = "0.2"
tempfile = "3.10"
tokio = { version = "1.47", features = ["full"] }
httptest = "0.16.3"
