[package]
name = "master-node"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
pmi = { path = "../pmi-internal", features = ["zenoh"] }
config = { path = "../config-internal" }
node-stack = { path = "../node-stack-internal" }
peppylib = { path = "../peppylib" }
generator = { path = "../generator-internal" }
bytes = "1.10"
hostname = "0.4"
capnp = "0.25"
futures = "0.3"
names-generator2 = "0.2"
rand = "0.9"
serde_json = "1.0"
serde_json5 = "0.2"
thiserror = "2.0"
tokio = { version = "1.47", features = ["sync", "rt", "time"] }
tracing = "0.1"
askama = "0.15"

[build-dependencies]
capnpc = "0.25"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.47", features = ["full"] }
