# The one way to send a stack goal to a daemon, follow it and read its
# result, with the default budgets of a goal that adds nodes. The CLI's
# `stack` commands and the daemon bridge of the built-in MCP server both use
# it, so it depends on neither.
[package]
name = "stack-goal"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
# The goals, their admission, feedback and result codecs, the budgets, and
# the stack list the copies are read from.
core-node-api = { workspace = true }
# The messenger the goal travels on, and the node a caller can be.
peppylib = { workspace = true }
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
# The copy name of the join the crate's documentation sends, and the names
# of a listed copy.
config = { workspace = true }
# One poll of a pending `next()`, so a test drops it at its await point.
futures = "0.3"
# The ephemeral router and the mock daemon action the tests drive a goal
# through.
peppylib = { workspace = true, features = ["testing"] }
# The zenohd binary the ephemeral router runs, built from source.
pmi = { workspace = true, features = ["zenoh", "build_zenoh"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
