[package]
name = "pmi"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
config = { path = "../config-internal" }
askama = "0.16"
bytes = "1"
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "rt"] }
# Used for Subscription / ServiceQueryable channels: a flume bounded
# channel lets the zenoh reception callback `send` synchronously (with
# backpressure) from any thread, including zenoh's runtime worker where
# `tokio::sync::mpsc::Sender::blocking_send` would panic.
flume = "0.12"
tracing = "0.1"
derive_more = { version = "2", features = ["from"] }
tempfile = "3"

# Optional deps
zenoh = { version = "=1.9.0", optional = true }

[build-dependencies]
build-helpers = { path = "../build-helpers-internal" }
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = [
    "sync",
    "rt",
    "macros",
    "time",
    "test-util",
] }
serde_json5 = "0.2"
# Used by the FIFO-noise regression test in `tests/fifo_noise.rs` to install a
# process-wide tracing subscriber that counts `zenoh::api::handlers::fifo`
# ERROR events. Already in the dependency tree transitively via zenoh.
tracing-subscriber = "0.3"

[features]
default = ["zenoh"]
# Feature to enable zenoh messaging backend
zenoh = ["dep:zenoh"]
# Feature to download the pre-built zenohd binary from GitHub releases
build_zenoh = ["zenoh"]
