[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pairing_hub"
version = "0.1.0"
description = "Fixture follower holding one pair per leader on one slot, answering each leader on its own pair and logging who it heard from"
requires-python = ">=3.13,<3.14"
dependencies = ["peppygen", "peppylib"]

[project.scripts]
pairing_hub = "pairing_hub.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pairing_hub"]

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
