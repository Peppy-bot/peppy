[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "set_watch"
version = "0.1.0"
description = "Fixture watching the arms and leaders copies add to two zero_or_more slots, logging each set and the first message from every member"
requires-python = ">=3.13,<3.14"
dependencies = ["peppygen", "peppylib"]

[project.scripts]
set_watch = "set_watch.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/set_watch"]

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
