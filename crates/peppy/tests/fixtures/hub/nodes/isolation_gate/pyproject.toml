[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isolation_gate"
version = "0.1.0"
description = "Fixture gate node: moves the held goal of every commander it is linked to on, by cancel or release"
requires-python = ">=3.13,<3.14"
dependencies = ["peppygen", "peppylib"]

[project.scripts]
isolation_gate = "isolation_gate.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/isolation_gate"]

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
