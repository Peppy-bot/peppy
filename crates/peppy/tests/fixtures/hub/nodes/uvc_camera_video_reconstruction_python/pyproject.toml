[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uvc_camera_video_reconstruction_python"
version = "0.1.0"
description = "Fixture consumer node: counts frames for a bounded duration"
requires-python = ">=3.13,<3.14"
dependencies = ["peppygen", "peppylib"]

[project.scripts]
uvc_camera_video_reconstruction_python = "uvc_camera_video_reconstruction_python.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uvc_camera_video_reconstruction_python"]

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
