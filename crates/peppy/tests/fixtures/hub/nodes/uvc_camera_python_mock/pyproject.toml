[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uvc_camera_python_mock"
version = "0.1.0"
description = "Fixture camera node: emits a synthetic RGB frame at a fixed rate"
requires-python = ">=3.13,<3.14"
dependencies = ["peppygen", "peppylib"]

[project.scripts]
uvc_camera_python_mock = "uvc_camera_python_mock.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uvc_camera_python_mock"]

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
