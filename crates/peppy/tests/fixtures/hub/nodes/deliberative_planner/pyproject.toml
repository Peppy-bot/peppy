[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deliberative_planner"
version = "0.1.0"
description = "Fixture planner node: publishes subgoals from a remote vantage"
requires-python = ">=3.13,<3.14"
dependencies = ["peppygen", "peppylib"]

[project.scripts]
deliberative_planner = "deliberative_planner.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deliberative_planner"]

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
