[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isolation_arm"
version = "0.1.0"
description = "Fixture arm node: a heartbeat, an echo service and a move action, each logging who it heard from"
requires-python = ">=3.13,<3.14"
dependencies = ["peppygen", "peppylib"]

[project.scripts]
isolation_arm = "isolation_arm.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/isolation_arm"]

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
