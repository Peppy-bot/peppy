[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my_python_robot_arm"
version = "0.1.0"
description = "Fixture arm node: publishes joint states at a fixed rate"
requires-python = ">=3.13,<3.14"
dependencies = ["peppygen", "peppylib"]

[project.scripts]
my_python_robot_arm = "my_python_robot_arm.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/my_python_robot_arm"]

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
