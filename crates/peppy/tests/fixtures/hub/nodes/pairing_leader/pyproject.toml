[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pairing_leader"
version = "0.1.0"
description = "Fixture leader sending one value as its setpoints and logging every state it hears back"
requires-python = ">=3.13,<3.14"
dependencies = ["peppygen", "peppylib"]

[project.scripts]
pairing_leader = "pairing_leader.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pairing_leader"]

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
