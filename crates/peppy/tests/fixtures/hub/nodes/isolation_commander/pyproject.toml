[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isolation_commander"
version = "0.1.0"
description = "Fixture commander node: drives its own copy's arm over a topic, a service and an action"
requires-python = ">=3.13,<3.14"
dependencies = ["peppygen", "peppylib"]

[project.scripts]
isolation_commander = "isolation_commander.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/isolation_commander"]

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
