[package]
name = "peppy"
version.workspace = true
edition.workspace = true

[dependencies]
pmi = { path = "../pmi-internal", features = ["zenoh"] }
config = { path = "../config-internal" }
peppylib = { path = "../peppylib" }
master-node = { path = "../master-node-internal" }
node-stack = { path = "../node-stack-internal" }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
askama = "0.15"
# https://docs.rs/quote/latest/quote/
clap = { version = "4.5.42", features = ["derive"] }
tokio = { version = "1.47", features = ["signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
derive_more = { version = "2", features = ["from"] }
rayon = "1.11.0"
service-manager = "0.10"
ipnet = "2.11"
netdev = "0.40"
libc = "0.2"
names-generator2 = "0.2"
rand = "0.9"

[dev-dependencies]
tempfile = "3.8"
