[package]
name = "peppy"
version.workspace = true
edition.workspace = true
autotests = false

[dependencies]
pmi = { path = "../pmi-internal", features = ["zenoh"] }
config = { path = "../config-internal" }
peppylib = { path = "../peppylib" }
master-node = { path = "../master-node-internal" }
node-stack = { path = "../node-stack-internal" }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
askama = "0.15"
# https://docs.rs/quote/latest/quote/
clap = { version = "4.5.42", features = ["derive"] }
tokio = { version = "1.47", features = ["signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
derive_more = { version = "2", features = ["from"] }
rayon = "1.11.0"
service-manager = "0.10"
ipnet = "2.11"
netdev = "0.40"
libc = "0.2"
names-generator2 = "0.2"
rand = "0.9"
crossterm = "0.29"
tempfile = { version = "3.8", optional = true }

[features]
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile = "3.8"

[[test]]
name = "service_install"
path = "tests/service_install.rs"

[[test]]
name = "service_reset"
path = "tests/service_reset.rs"
required-features = ["test-support"]

[[test]]
name = "service_serve"
path = "tests/service_serve.rs"
required-features = ["test-support"]

[[test]]
name = "node_add"
path = "tests/node_add.rs"
required-features = ["test-support"]

[[test]]
name = "node_init"
path = "tests/node_init.rs"
required-features = ["test-support"]

[[test]]
name = "node_remove"
path = "tests/node_remove.rs"
required-features = ["test-support"]

[[test]]
name = "node_runtime_config"
path = "tests/node_runtime_config.rs"
required-features = ["test-support"]

[[test]]
name = "node_start"
path = "tests/node_start.rs"
required-features = ["test-support"]

[[test]]
name = "node_stop"
path = "tests/node_stop.rs"
required-features = ["test-support"]

[[test]]
name = "node_sync"
path = "tests/node_sync.rs"
required-features = ["test-support"]

[[test]]
name = "stack_launch"
path = "tests/stack_launch.rs"
required-features = ["test-support"]

[[test]]
name = "stack_list"
path = "tests/stack_list.rs"
required-features = ["test-support"]
