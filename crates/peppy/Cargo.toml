[package]
name = "peppy"
version.workspace = true
edition.workspace = true
autotests = false

[dependencies]
pmi = { path = "../pmi-internal", features = ["zenoh", "build_zenoh"] }
config = { path = "../config-internal" }
containers = { path = "../containers-internal" }
peppylib = { path = "../peppylib" }
core-node = { path = "../core-node-internal" }
core-node-api = { path = "../core-node-api" }
node-stack = { path = "../node-stack-internal" }
latency-report = { path = "../latency-report" }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json5 = "0.2"
askama = "0.16"
gix-url = "0.36"
url = "2"
# https://docs.rs/quote/latest/quote/
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["signal"] }
tokio-util = "0.7"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
derive_more = { version = "2", features = ["from"] }
rayon = "1.11.0"
service-manager = "0.11"
ipnet = "2.11"
netdev = "0.44"
# Safe wrappers over the libc syscalls peppy needs (getuid/geteuid and the
# kill(pid, 0) liveness probe), so the crate carries no `unsafe` for them.
rustix = { version = "1", features = ["process"] }
dirs = "6"
names-generator2 = "0.2.1"
rand = "0.10"
crossterm = "0.29"
walkdir = "2.5"
# Terminal display width for aligning `stack list` table columns when a cell
# (e.g. a Unicode filesystem path) contains wide or zero-width glyphs.
unicode-width = "0.2"
tempfile = { version = "3.8", optional = true }
parking_lot = { workspace = true, optional = true }

[build-dependencies]
build-helpers = { path = "../build-helpers-internal" }

[features]
# The shipped CLI carries no test scaffolding by default. `test-support` is
# opt-in and enabled for this crate's own tests via the dev-dependency
# self-reference below, so `cargo test` works without extra flags while a plain
# `cargo build`/`cargo install` stays lean.
default = []
# Gate test-only helpers (including config's fingerprint helpers and
# their git2 transitive dep) behind this feature so a release build doesn't
# carry them.
test-support = ["dep:tempfile", "dep:parking_lot", "config/test_helpers"]

[dev-dependencies]
tempfile = "3.8"
# Only the daemon-lifecycle e2e test needs raw `kill(2)` to signal a spawned
# child process; the library itself uses `rustix` and carries no `libc`.
libc = "0.2"
# Self-reference so `cargo test` builds this crate with the test-only helpers
# enabled, without making `test-support` a default feature of the shipped CLI.
peppy = { path = ".", features = ["test-support"] }

[[test]]
name = "integration"
path = "tests/main.rs"
