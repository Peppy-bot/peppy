[package]
name = "peppy"
version.workspace = true
edition.workspace = true
autotests = false

[dependencies]
pmi = { path = "../pmi-internal", features = ["zenoh", "build_zenoh"] }
config = { path = "../config-internal" }
peppylib = { path = "../peppylib" }
daemon-node = { path = "../daemon-node-internal" }
node-stack = { path = "../node-stack-internal" }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
askama = "0.15"
gix-url = "0.35"
url = "2"
# https://docs.rs/quote/latest/quote/
clap = { version = "4.5.42", features = ["derive"] }
tokio = { version = "1.47", features = ["signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
derive_more = { version = "2", features = ["from"] }
rayon = "1.11.0"
service-manager = "0.11"
ipnet = "2.11"
netdev = "0.40"
libc = "0.2"
dirs = "6"
names-generator2 = "0.2.1"
rand = "0.10"
crossterm = "0.29"
tempfile = { version = "3.8", optional = true }

[features]
default = ["test-support"]
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile = "3.8"

[[test]]
name = "integration"
path = "tests/main.rs"
