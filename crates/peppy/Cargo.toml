[package]
name = "peppy"
version.workspace = true
edition.workspace = true
autotests = false

[dependencies]
pmi = { path = "../pmi-internal", features = ["zenoh", "build_zenoh"] }
config = { path = "../config-internal" }
containers = { path = "../containers-internal" }
peppylib = { path = "../peppylib" }
core-node = { path = "../core-node-internal" }
core-node-api = { path = "../core-node-api" }
node-stack = { path = "../node-stack-internal" }
latency-report = { path = "../latency-report" }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json5 = "0.2"
askama = "0.16"
gix-url = "0.36"
url = "2"
# https://docs.rs/quote/latest/quote/
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["signal"] }
tokio-util = "0.7"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
derive_more = { version = "2", features = ["from"] }
rayon = "1.11.0"
service-manager = "0.11"
ipnet = "2.11"
netdev = "0.44"
libc = "0.2"
dirs = "6"
names-generator2 = "0.2.1"
rand = "0.10"
crossterm = "0.29"
walkdir = "2.5"
# Terminal display width for aligning `stack list` table columns when a cell
# (e.g. a Unicode filesystem path) contains wide or zero-width glyphs.
unicode-width = "0.2"
tempfile = { version = "3.8", optional = true }
parking_lot = { workspace = true, optional = true }

[build-dependencies]
build-helpers = { path = "../build-helpers-internal" }

[features]
default = ["test-support"]
# Gate test-only helpers (including config's fingerprint helpers and
# their git2 transitive dep) behind this feature so a release build with
# `--no-default-features` doesn't carry them.
test-support = ["dep:tempfile", "dep:parking_lot", "config/test_helpers"]

[dev-dependencies]
tempfile = "3.8"

[[test]]
name = "integration"
path = "tests/main.rs"
