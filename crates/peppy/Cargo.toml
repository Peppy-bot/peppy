[package]
name = "peppy"
version.workspace = true
edition.workspace = true
autotests = false

[dependencies]
auth = { workspace = true }
pmi = { workspace = true, features = ["zenoh", "build_zenoh"] }
config = { workspace = true }
daemon-config = { workspace = true }
containers = { workspace = true }
peppylib = { workspace = true }
core-node = { workspace = true }
core-node-api = { workspace = true }
node-stack = { workspace = true }
latency-report = { workspace = true }
json5-pretty = { workspace = true }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json5 = "0.2"
gix-url = "0.36"
url = "2"
# https://docs.rs/quote/latest/quote/
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["signal"] }
tokio-util = "0.7"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
derive_more = { version = "2", features = ["from"] }
service-manager = "0.11"
# Safe wrappers over the libc syscalls peppy needs (getuid/geteuid and the
# kill(pid, 0) liveness probe), so the crate carries no `unsafe` for them.
rustix = { version = "1", features = ["process"] }
dirs = "6"
names-generator2 = "0.2.1"
rand = "0.10"
crossterm = "0.29"
# Terminal display width for aligning `stack list` table columns when a cell
# (e.g. a Unicode filesystem path) contains wide or zero-width glyphs.
unicode-width = "0.2"
# Auto-open the browser at the device-flow verification URL on a TTY.
open = "5"
# Spinner shown while polling the token endpoint for device-flow approval.
indicatif = "0.18"
# Keep OAuth tokens out of `Debug`/log output; the on-disk struct serializes
# them through explicit expose helpers (the one place we intentionally expose).
secrecy = "0.10"
tempfile = { version = "3.8", optional = true }
parking_lot = { workspace = true, optional = true }

[build-dependencies]
build-helpers = { workspace = true }

[features]
# The shipped CLI carries no test scaffolding by default. `test-support` is
# opt-in and enabled for this crate's own tests via the dev-dependency
# self-reference below, so `cargo test` works without extra flags while a plain
# `cargo build`/`cargo install` stays lean.
default = []
# Gate test-only helpers (including config's fingerprint helpers) behind this
# feature so a release build doesn't carry them.
test-support = ["dep:tempfile", "dep:parking_lot", "config/fingerprint_test_helpers"]

[dev-dependencies]
tempfile = "3.8"
# In-process HTTP mock server for the auth integration tests (cli-config, OIDC
# discovery, device/token endpoints, /me, /logout); blocking API, fits ureq.
httpmock = "0.8"
# Self-reference so `cargo test` builds this crate with the test-only helpers
# enabled, without making `test-support` a default feature of the shipped CLI.
peppy = { path = ".", features = ["test-support"] }

[[test]]
name = "integration"
path = "tests/main.rs"
