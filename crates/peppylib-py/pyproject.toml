[project]
name = "peppylib"
dynamic = ["version"]
license = { text = "Apache-2.0" }
authors = [{ name = "GODARD Tuatini", email = "tuatini@peppy.bot" }]
requires-python = ">= 3.11"
description = "The peppyOS control library"
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
# Pipy dependencies
dependencies = []

[project.urls]
Homepage = "https://dev.peppy.bot"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "peppylib._peppylib"

[tool.maturin.version]
provider = "file"
path = "peppylib/_version.py"

[tool.uv.workspace]
members = [
    "examples/hello_world_topic_subscribes_to",
    "examples/hello_world_topic_exposes",
]
