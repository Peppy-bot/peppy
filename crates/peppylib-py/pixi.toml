[workspace]
name = "peppylib"
version = "0.0.1"
description = "The peppyOS control library"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "linux-aarch64"]

[dependencies]
python = ">=3.11,<3.14"
pip = "*"

[pypi-dependencies]
maturin = ">=1.0,<2.0"
pytest = ">=9.0"
pytest-asyncio = ">=1.3"

[target.linux-64.pypi-dependencies]
patchelf = ">=0.17.2.4"

[tasks]
dev = "maturin develop"
release = "maturin develop --release"
test = "maturin develop && pytest tests/ -v"
zenoh-simple = "cargo run --manifest-path ../peppylib/examples/zenohd_simple/Cargo.toml"

# Create a package that can be deployed on Pypi
create-wheel = "bash scripts/create_wheel.sh"

topic-exposes = "maturin develop && python examples/hello_world_topic_exposes/main.py"
topic-subscribes = "maturin develop && python examples/hello_world_topic_subscribes_to/main.py"

service-exposes = "maturin develop && python examples/hello_world_service_exposes/main.py"
service-subscribes = "maturin develop && python examples/hello_world_service_subscribes_to/main.py"

action-exposes = "maturin develop && python examples/hello_world_action_exposes/main.py"
action-subscribes = "maturin develop && python examples/hello_world_action_subscribes_to/main.py"
