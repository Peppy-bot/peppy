[package]
name = "peppycl"
version.workspace = true
edition.workspace = true
homepage = "https://dev.peppy.bot"
description = "The peppyOS control library"
license = "MIT OR Apache-2.0"
readme = "Readme.md"

[dependencies]
pmi = { path = "../pmi-internal" }
config = { path = "../config-internal" }
thiserror = "2.0"                                   # Avoid Anyhow in this crate
tokio = { version = "1.47.0", features = ["full"] }
tracing = "0.1.41"
bytes = "1"
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
tempfile = "3.8"
askama = "0.14.0"
tokio = { version = "1.47.0", features = ["full"] }
