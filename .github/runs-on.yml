# RunsOn runners for this repository's workflows.
#
# Every repository inherits the org config in Peppy-bot/.github-private: the
# runner `peppy-ci-ubuntu-24.04-x86_64` and the images `peppy-ubuntu24` (x64)
# and `peppy-ubuntu24-aarch64` (arm64). Its top-level keys are not deep-merged
# with this file. This file defines `runners:`, so it replaces the org runner
# list, and the org runner is copied below unchanged; keep it identical to the
# org definition. This file does not define `images:`, so the org images are
# still inherited.
#
# RunsOn sets EC2 tags only from a runner definition, and every instance must
# carry `Environment:shared` and `Stack:github-action-runners`, so every job
# names one of these runners with `runner=` and adjusts it with labels.
#
# This repository is public, so RunsOn reads this file from dev alone: a pull
# request cannot change or test what it defines. The CI jobs therefore shape
# the org runner with labels, and this file holds only what labels cannot
# express.
runners:
  # The org runner, copied verbatim.
  peppy-ci-ubuntu-24.04-x86_64:
    cpu: 16
    ram: 32
    volume: 100gb:gp3
    sticky: build-cache:40gb
    family: ["c5", "m6i", "c6i", "m4", "m5", "c7i", "m7i"]
    image: peppy-ubuntu24            # custom Peppy AMI (org config)
    spot: price-capacity-optimized
    tags:
      - Environment:shared
      - Stack:github-action-runners

  # The Linux aarch64 release stages, provision and build, which build
  # natively on Graviton. The org runner and peppy-ubuntu24 are x64 only, so
  # this boots peppy-ubuntu24-aarch64, the arm64 build of the CI image with the
  # same setup_machine.sh toolchain. 16 vCPU with 32 or 64 GB, the core count
  # of the x86_64 stages (a Graviton vCPU is a full core, as on the AMD
  # families those stages use), on the Graviton3 and Graviton4 compute and
  # general purpose families, so that spot has four families to choose from.
  # On spot, as the x86_64 stages: these stages only build and upload an
  # artifact, and RunsOn runs one that AWS interrupts again on demand. The
  # release runs from dev, which is where RunsOn reads this.
  release-arm64:
    cpu: 16
    ram: [32, 64]
    family: ["c8g", "c7g", "m8g", "m7g"]
    image: peppy-ubuntu24-aarch64    # custom Peppy AMI (org config)
    volume: 150gb:gp3:500mbs:6000iops
    spot: price-capacity-optimized
    tags:
      - Environment:shared
      - Stack:github-action-runners
