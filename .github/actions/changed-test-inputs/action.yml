name: Detect changed test inputs
description: >-
  Emits one output per conditionally-run job in tests.yml naming what the
  change set requires it to run: a boolean for the jobs that are all or
  nothing, and a package selection for the job that splits into units testable
  on their own. The dependency graph behind the selection is read from the
  manifests at run time, so newly added or rewired crates are picked up with
  nothing to maintain here. Jobs gated off get their skip reason reported to
  the job's annotations and step summary. Fails open: on any detection error
  every suite runs with everything selected.
inputs:
  base:
    description: Commit the branch's changes are diffed against (the PR
      base sha, or the previously pushed sha for push events).
    required: true
outputs:
  workspace:
    description: >-
      Whether the inputs of the workspace suite changed: any default member of
      the `peppy` workspace, or a crate one of them reaches.
    value: ${{ steps.detect.outputs.workspace }}
  container_e2e:
    description: Whether the container e2e suite's inputs changed.
    value: ${{ steps.detect.outputs.container_e2e }}
  multi_daemon_e2e:
    description: Whether the multi-daemon e2e suite's inputs changed.
    value: ${{ steps.detect.outputs.multi_daemon_e2e }}
  docs_integration:
    description: Whether the docs integration suite's inputs changed.
    value: ${{ steps.detect.outputs.docs_integration }}
  cross_check:
    description: Whether the inputs of the cross-compilation check changed.
    value: ${{ steps.detect.outputs.cross_check }}
  scripts:
    description: Whether the mocked release scripts suite's inputs changed.
    value: ${{ steps.detect.outputs.scripts }}
  install_script:
    description: >-
      Whether the inputs of the install.sh tests changed: what decides what a
      runner installs and how, which is a much narrower set than the tree the
      mocked half of the release scripts suite is gated on.
    value: ${{ steps.detect.outputs.install_script }}
  peppy_shared_packages:
    description: >-
      The cargo package selection flags for the peppy-shared workspace, naming
      the packages whose own directory or whose dependencies were touched
      (`-p a -p b`, or `--workspace --exclude peppylib-py` when everything
      runs). Empty when no package of the workspace was reached.
    value: ${{ steps.detect.outputs.peppy_shared_packages }}
  peppy_shared_peppylib_py:
    description: >-
      Whether the peppylib-py Python suite's inputs changed. It is the one
      peppy-shared package tested outside cargo, so it carries its own gate.
    value: ${{ steps.detect.outputs.peppy_shared_peppylib_py }}
runs:
  using: composite
  steps:
    - id: detect
      # Needs cargo on PATH for the metadata query, so tests.yml runs this
      # after the rust-build-env action.
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/detect.py"
      env:
        INPUT_BASE: ${{ inputs.base }}
