name: Python tooling
description: >-
  Installs the pixi and uv that build scripts and Python test suites execute.
  The runner image ships neither. generator-internal's build script builds the
  embedded peppylib .so through a bare `pixi run` and, when pixi is absent,
  refuses to serve a stale .so instead, which is fatal on an ephemeral runner
  whose ~/.peppy cache starts empty. The Python generator tests, the latency
  scenarios and the public-peppy-libs Python suites likewise exec bare `uv` on
  the host.

runs:
  using: composite
  steps:
    # Installed exactly as scripts/setup_machine.sh installs them, pixi pinned
    # to a version that satisfies every `requires-pixi` (scripts/pixi.toml,
    # peppylib-py's pixi.toml); $GITHUB_PATH exports them to every later step
    # of the calling job (the installers' own profile edits are never sourced
    # there).
    - name: Install pixi and uv
      shell: bash
      run: |
        curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.80.0 sh
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
