name: Cargo build cache
description: >-
  Keeps the suite's cargo target directory, the cargo registry, the build
  scripts' tool cache and pixi's package cache on the job's RunsOn sticky
  disk, so a job compiles only what changed since the suite last ran. The
  job's runs-on label must request the suite's sticky disk
  (`sticky=<suite>:<size>`). Expects the checkout and the Rust toolchain to be
  in place, and must precede every cargo step.

inputs:
  suite:
    description: >-
      The suite the job runs, one cache directory per suite: the suites compile
      different feature sets and test targets, and a directory per suite stays
      warm for exactly the build reading it.
    required: true
  target-dir:
    description: >-
      The cargo target directory the suite builds into, relative to the
      repository root: `target` of whichever workspace the suite runs in.
    default: target

runs:
  using: composite
  steps:
    # RunsOn restores the sticky disk the job's runs-on label names from the
    # newest snapshot of it taken on this branch, or on the default branch
    # when this branch has none, and snapshots it again after the job. A pull
    # request's run never writes the default branch's snapshot. This action
    # bind-mounts each directory below onto that disk, at the path its tool
    # already uses:
    #
    #   - `cargo`: the registry and the git checkouts under ~/.cargo.
    #   - ~/.peppy/tmp: the build scripts' tool cache
    #     (build_helpers::cache_dir), where apptainer, zenohd and the peppylib
    #     .so are built once per version and content.
    #   - ~/.cache/rattler: pixi's package cache, for the peppylib build and
    #     the pixi environments the suites install.
    #   - ~/.cache/peppy-ci: the suite's target directory, linked below.
    #
    # Everything there is keyed by content or rebuilt by cargo when stale, so
    # what a run finds is a hit for the same bytes or a miss, never state one
    # run depends on another having written.
    - uses: runs-on/action@v2
      with:
        sticky_cache: |
          cargo
          custom,path=~/.peppy/tmp,path=~/.cache/rattler,path=~/.cache/peppy-ci

    # The month is in the name because cargo never removes an artifact a
    # dependency bump or a profile change superseded, so a target directory
    # only grows. The first run of a month starts empty and pays one cold
    # build, the prune below drops the previous month, and a directory is
    # never older than a month of leftovers.
    - name: Name the suite's cache directory
      id: cache
      shell: bash
      run: |
        set -euo pipefail
        echo "dir=$HOME/.cache/peppy-ci/${{ inputs.suite }}-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

    # Drops this suite's directories from every other month.
    - name: Prune the previous months' caches
      shell: bash
      run: |
        set -euo pipefail
        keep="${{ steps.cache.outputs.dir }}"
        root="$HOME/.cache/peppy-ci"
        prefix="${{ inputs.suite }}-"
        mkdir -p "$root"
        for d in "$root/$prefix"*; do
          [ -d "$d" ] || continue
          if [ "$d" != "$keep" ]; then
            echo "Pruning stale cache $d"
            rm -rf "$d"
          fi
        done

    # Only the suite's target directory is redirected, and through a symlink
    # rather than CARGO_TARGET_DIR: the docs snippet runner builds its nodes
    # under the workspace's own `target/`, so linking the directory leaves the
    # path where every tool expects it.
    #
    # Incremental compilation is off: its caches are most of a debug target
    # directory and all it would save is the seconds a warm rebuild of a
    # crate's own code takes. Debug info is held to line tables for the same
    # reason: with full debug info every test binary of this workspace exceeds
    # a gigabyte, while all CI reads of it are the file and line in a panic
    # backtrace, which line tables keep. The test profile inherits the dev
    # profile's setting.
    #
    # One subtree of `target/` stays off the sticky disk: the workspace's
    # .cargo/config.toml routes uv's cache to `target/uv-cache`, and the
    # Python generator tests fill it with a freshly built peppylib wheel per
    # test, each under a new hash in an append-only cache. Tens of gigabytes
    # per run that no later run reads, so that directory lives in the
    # runner's temp dir and dies with the job.
    - name: Link the target directory to the cache
      shell: bash
      run: |
        set -euo pipefail
        disk="${{ steps.cache.outputs.dir }}"
        # link <path> <store>: the path becomes a symlink to the store. A
        # real directory already at the path is a cargo step that ran before
        # this action, an ordering mistake this refuses to hide.
        link() {
          local path=$1 store=$2
          mkdir -p "$store" "$(dirname "$path")"
          if [ -e "$path" ] && [ ! -L "$path" ]; then
            echo "::error::$path exists and is not a symlink; cargo-cache must run before any cargo step"
            exit 1
          fi
          ln -sfn "$store" "$path"
        }
        link "$GITHUB_WORKSPACE/${{ inputs.target-dir }}" "$disk/target"
        link "$disk/target/uv-cache" "$RUNNER_TEMP/uv-cache"
        {
          echo "CARGO_INCREMENTAL=0"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only"
        } >> "$GITHUB_ENV"
        # Two invocations: du counts a directory once per invocation, so the
        # target subtrees would print nothing after target itself.
        echo "Cache contents at start:"
        du -sh "$disk"/* 2>/dev/null || true
        du -sh "$disk"/target/* 2>/dev/null || true
