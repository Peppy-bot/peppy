name: Cargo build cache
description: >-
  Points the cargo target directory at a directory that persists on the
  self-hosted runner between jobs, so a job compiles only what changed since the
  suite last ran. The cargo registry and the build scripts' tool cache are left
  to the runner, which keeps them across jobs of its own accord. Expects the
  checkout and the rust-build-env action to have run first, and must precede
  every cargo step.

inputs:
  suite:
    description: >-
      The suite the job runs, one cache directory per suite: the suites compile
      different feature sets and test targets, and a directory per suite stays
      warm for exactly the build reading it.
    required: true

runs:
  using: composite
  steps:
    # The runner is self-hosted and reused, so a directory under $HOME simply
    # outlives the job; nothing mounts or uploads it. The name carries the
    # architecture because every artifact in it is built for the host that
    # built it, and the month because cargo never removes an artifact a
    # dependency bump or a profile change superseded, so a target directory
    # only grows. The first run of a month starts empty and pays one cold
    # build per suite, the prune below drops the previous month, and a
    # directory is never older than a month of leftovers.
    #
    # Unlike the Blacksmith sticky disk this replaces, the directory is live
    # rather than a clone of a committed snapshot: a run reads what the
    # previous run left, and any pull request scheduled here — a fork's
    # included, since every job runs on this runner — writes into what later
    # runs build on. So nothing stored here may be state one run depends on
    # another having written, only what cargo and the build scripts rebuild
    # from scratch. The single self-hosted runner executes one
    # job at a time, so concurrent writers are not a concern today; a second
    # runner would make the target directories shared mutable state and is a
    # reason to revisit this.
    - name: Name the suite's cache directory
      id: cache
      shell: bash
      run: |
        set -euo pipefail
        echo "dir=$HOME/.cache/peppy-ci/${{ inputs.suite }}-${{ runner.arch }}-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

    # Drops this suite's directories from every other month. Scoped to the
    # suite so a prune never deletes a directory a concurrently queued job of
    # another suite is building in.
    - name: Prune the previous months' caches
      shell: bash
      run: |
        set -euo pipefail
        keep="${{ steps.cache.outputs.dir }}"
        root="$HOME/.cache/peppy-ci"
        prefix="${{ inputs.suite }}-${{ runner.arch }}-"
        mkdir -p "$root"
        for d in "$root/$prefix"*; do
          [ -d "$d" ] || continue
          if [ "$d" != "$keep" ]; then
            echo "Pruning stale cache $d"
            rm -rf "$d"
          fi
        done

    # Only `target/` is redirected, and only through a symlink rather than
    # CARGO_TARGET_DIR: the docs snippet runner builds its nodes under the
    # workspace's own `target/`, so linking the directory leaves the path
    # where every tool expects it.
    #
    # What this deliberately does NOT touch is anything under $HOME. The
    # cargo registry, the git checkouts and the build scripts' tool cache
    # (`~/.peppy/tmp`) used to be linked in here too, which made sense when
    # the runner was discarded with the job: nothing else would ever be in
    # those paths. On the reused self-hosted runner they are the box's own
    # directories, shared with every other repository's jobs — public-peppy-libs
    # runs `cargo test` as the same user — so a real directory sitting there is
    # the normal state rather than the ordering mistake the old guard took it
    # for, and linking them away both failed that guard and fought the other
    # repositories for $HOME. They persist on the box by themselves and are
    # keyed by content (the registry by crate and checksum, the tool cache by
    # version and content in build_helpers::cache_dir), so they are a hit or a
    # miss per entry and need no management from here. The trade is that they
    # fall outside the monthly prune below; the registry grows slowly, where
    # `target/` is what reached 39 GB in one suite.
    #
    # Incremental compilation is off: its caches are most of a debug target
    # directory and all it would save is the seconds a warm rebuild of a
    # crate's own code takes. Debug info is held to line tables for the same
    # reason: with full debug info every test binary of this workspace exceeds
    # a gigabyte, while all CI reads of it are the file and line in a panic
    # backtrace, which line tables keep. The test profile inherits the dev
    # profile's setting.
    #
    # One subtree of `target/` stays out of the cache: the workspace's
    # .cargo/config.toml routes uv's cache to `target/uv-cache`, and the
    # Python generator tests fill it with a freshly built peppylib wheel per
    # test, each under a new hash in an append-only cache. Tens of gigabytes
    # per run that no later run reads, so that directory lives in the
    # runner's temp dir and dies with the job.
    - name: Link the target directory to the cache
      shell: bash
      run: |
        set -euo pipefail
        disk="${{ steps.cache.outputs.dir }}"
        # link <path> <store>: the path becomes a symlink to the store. These
        # are per-job paths inside the checkout, which `actions/checkout`
        # cleans, so a real directory at one is a cargo step that ran before
        # this action — an ordering mistake this refuses to hide.
        link() {
          local path=$1 store=$2
          mkdir -p "$store" "$(dirname "$path")"
          if [ -e "$path" ] && [ ! -L "$path" ]; then
            echo "::error::$path exists and is not a symlink; cargo-cache must run before any cargo step"
            exit 1
          fi
          ln -sfn "$store" "$path"
        }
        link "$GITHUB_WORKSPACE/target" "$disk/target"
        # A cache directory written while uv's cache still lived in it holds
        # it as a real directory; it goes before the link takes its place.
        if [ -d "$disk/target/uv-cache" ] && [ ! -L "$disk/target/uv-cache" ]; then
          rm -rf "$disk/target/uv-cache"
        fi
        link "$disk/target/uv-cache" "$RUNNER_TEMP/uv-cache"
        {
          echo "CARGO_INCREMENTAL=0"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only"
        } >> "$GITHUB_ENV"
        # Two invocations: du counts a directory once per invocation, so the
        # target subtrees would print nothing after target itself.
        echo "Cache contents at start:"
        du -sh "$disk"/* 2>/dev/null || true
        du -sh "$disk"/target/* 2>/dev/null || true
