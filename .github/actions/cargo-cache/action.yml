name: Cargo build cache
description: >-
  Mounts the suite's Blacksmith sticky disk and links the cargo target
  directory, the cargo registry and git checkouts, and the build scripts' tool
  cache into it, so a job compiles only what changed since the disk was last
  committed. Expects the checkout and the Rust toolchain to be in place, and
  must precede every cargo step.

inputs:
  suite:
    description: >-
      The suite the job runs, one disk per suite: the suites compile different
      feature sets and test targets, and a disk per suite holds a snapshot that
      is warm for exactly the build reading it.
    required: true
  target-dir:
    description: >-
      The cargo target directory the suite builds into, relative to the
      repository root: `target` of whichever workspace the suite runs in.
    default: target

runs:
  using: composite
  steps:
    # Cargo never removes an artifact a dependency bump or a profile change
    # superseded, so a target directory only grows. The key carries the
    # month: the first run of a month starts from an empty disk and pays one
    # cold build per suite, the previous month's disk falls out of
    # Blacksmith's retention after seven idle days, and a disk is never
    # older than a month of leftovers.
    - name: Name the month's disk
      id: month
      shell: bash
      run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

    # Every run mounts a clone of the disk's last committed snapshot, so
    # nothing stored on it may be state one run depends on another having
    # written: only what cargo and the build scripts rebuild from scratch.
    # The key carries the architecture because every artifact on the disk is
    # built for the host that built it. A job commits only when it changed
    # the disk, and never from a fork's pull request: what every later run
    # builds on is written by this repository alone. A commit replaces the
    # snapshot whole, so of two pull requests running the same suite at once
    # one job's clone becomes the snapshot; both are warm builds of the same
    # workspace, so either serves the runs after them.
    - name: Mount the suite's build cache
      uses: useblacksmith/stickydisk@35ba2e331a80056a42af053ee54968511de2b7c7 # v1.5.0
      with:
        key: ${{ github.repository }}-cargo-${{ inputs.suite }}-${{ runner.arch }}-${{ steps.month.outputs.month }}
        path: ~/.cache/peppy-ci
        commit: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'on-change' || 'false' }}

    # Symlinks rather than CARGO_TARGET_DIR and CARGO_HOME: the docs snippet
    # runner builds its nodes under the workspace's own `target/`, and the
    # rustup proxies live in ~/.cargo/bin beside the registry. Linking the
    # directories leaves every path where each tool expects it. The build
    # scripts' tool cache (`~/.peppy/tmp`: the apptainer and squashfuse
    # sources they compile, the zenohd and Lima downloads, the peppylib
    # cross-build outputs) is keyed by version and content in
    # build_helpers::cache_dir, so a snapshot is either a hit or a miss for
    # every entry. Incremental compilation is off: its caches are most of a
    # debug target directory and the disk is billed per gigabyte, while all
    # it would save is the seconds a warm rebuild of a crate's own code takes.
    # Debug info is held to line tables for the same reason: with full debug
    # info every test binary of this workspace exceeds a gigabyte and one
    # suite's target directory reached 39 GB, while all CI reads of it are
    # the file and line in a panic backtrace, which line tables keep. The
    # test profile inherits the dev profile's setting.
    #
    # One subtree of `target/` stays off the disk: the workspace's
    # .cargo/config.toml routes uv's cache to `target/uv-cache`, and the
    # Python generator tests fill it with a freshly built peppylib wheel per
    # test, each under a new hash in an append-only cache. Tens of gigabytes
    # per run that no later run reads, so that directory lives in the
    # runner's temp dir and dies with the job.
    - name: Link cargo and the build scripts to the disk
      shell: bash
      run: |
        set -euo pipefail
        disk="$HOME/.cache/peppy-ci"
        # link <path> <store>: the path becomes a symlink to the store. A
        # real directory already at the path is a job that ran cargo before
        # this action, which this refuses to hide.
        link() {
          local path=$1 store=$2
          mkdir -p "$store" "$(dirname "$path")"
          if [ -e "$path" ] && [ ! -L "$path" ]; then
            echo "::error::$path exists and is not a symlink; cargo-cache must run before any cargo step"
            exit 1
          fi
          ln -sfn "$store" "$path"
        }
        link "$GITHUB_WORKSPACE/${{ inputs.target-dir }}" "$disk/target"
        link "$HOME/.cargo/registry" "$disk/cargo-registry"
        link "$HOME/.cargo/git" "$disk/cargo-git"
        link "$HOME/.peppy/tmp" "$disk/peppy-tmp"
        # A snapshot committed while uv's cache still lived on the disk holds
        # it as a real directory; it goes before the link takes its place.
        if [ -d "$disk/target/uv-cache" ] && [ ! -L "$disk/target/uv-cache" ]; then
          rm -rf "$disk/target/uv-cache"
        fi
        link "$disk/target/uv-cache" "$RUNNER_TEMP/uv-cache"
        {
          echo "CARGO_INCREMENTAL=0"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only"
        } >> "$GITHUB_ENV"
        # Two invocations: du counts a directory once per invocation, so the
        # target subtrees would print nothing after target itself.
        echo "Disk contents at mount:"
        du -sh "$disk"/* 2>/dev/null || true
        du -sh "$disk"/target/* 2>/dev/null || true
