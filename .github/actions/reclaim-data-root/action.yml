name: Reclaim an isolated peppy data root
description: >-
  Removes a suite's per-job peppy data root, and stops the sccache server that
  may still be holding a directory inside it as its temp directory. Reclaiming
  disk is housekeeping, so this never fails the job: it reports what it could
  not remove and leaves the suite's own result to speak for the suite.

inputs:
  path:
    description: >-
      The data root to reclaim, resolved to a concrete path by the caller.
      Pass it from the runner.temp context, not as a string naming a shell
      variable: this runs in a shell of its own, so a caller's $RUNNER_TEMP
      would arrive unexpanded. (Spelling that context here as an expression
      would not document it -- action metadata is itself a template, and the
      expression would be evaluated where no such context exists.)
    required: true

runs:
  using: composite
  steps:
    - name: Reclaim the data root
      shell: bash
      # Through the environment rather than an expression inside the script,
      # so the path is data and not shell source.
      env:
        ROOT: ${{ inputs.path }}
      run: |
        set -uo pipefail

        # sccache runs as a server that outlives the step which first spawned
        # it, and it captures TMPDIR when it starts -- which for these suites
        # is a directory inside the root being reclaimed here. Removing that
        # directory under a live server leaves it writing to a path that is
        # gone, and every later compile routed through it fails with
        # "Failed to create temp dir: No such file or directory", whether it
        # comes from a later step of this job or from the next job to land on
        # the box. Ephemeral runners never showed this, because the server
        # died with the machine that held the directory.
        #
        # Stopping the server loses no cached objects: the cache is on disk
        # and the next cargo invocation starts a fresh server against it.
        if command -v sccache >/dev/null 2>&1; then
          sccache --stop-server >/dev/null 2>&1 || true
        fi

        [ -e "$ROOT" ] || exit 0

        # Apptainer builds its rootfs inside a user namespace, so everything
        # under $PEPPY_HOME/tmp/apptainer belongs to a mapped subuid that this
        # user cannot unlink from outside that namespace. Plain `rm -rf` exits
        # non-zero on such a tree, and under `if: always()` that turned a job
        # whose every test had passed into a red one.
        if ! rm -rf "$ROOT" 2>/dev/null; then
          sudo -n rm -rf "$ROOT" 2>/dev/null || true
        fi

        if [ -e "$ROOT" ]; then
          echo "::warning title=Data root not reclaimed on ${RUNNER_NAME:-this runner}::$ROOT survived cleanup, so this box's disk keeps it until it is removed by hand. Usually an apptainer rootfs owned by a subuid this user cannot unlink; passwordless sudo on the box is what lets this step clear it."
        fi
        exit 0
