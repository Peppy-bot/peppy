name: install.sh tests
description: >-
  Installs the release archive of this runner's platform with install.sh and
  runs the install.sh tests against it (scripts/tests/test_install*.py). The
  quickstart test is one of them: a full install, the background service that
  it registers, `peppy info` and, on Linux, the launch of the quickstart. On
  an aarch64 runner the tests also install the archive on Raspberry Pi boards,
  in Docker containers of Raspberry Pi OS (its official image), Ubuntu and
  Debian. The tests change the machine they run on, and must start from a
  machine that a user starts from. So the action runs only on a machine that
  is discarded after the job and that no build was provisioned on: a RunsOn
  instance that boots a stock image of RunsOn, or a Blacksmith runner.

inputs:
  archive:
    description: The artifact holding the release archive of this runner's platform
    required: true
  hub-set:
    description: >-
      The artifact holding the hub set of a release (hub-set.json). With it,
      the install of the quickstart test reads each default hub at its commit
      of the set. Without it, that install reads its default hubs as it finds
      them.
    default: ""

runs:
  using: composite
  steps:
    # install.sh changes the machine (apt packages, systemd linger, an
    # AppArmor profile, a user service), so a machine that outlives the job
    # would keep those changes for every job after this one. RunsOn starts an
    # instance for one job and terminates it after: its agent names the
    # instance in RUNS_ON_INSTANCE_ID. Blacksmith starts a virtual machine for
    # each job, which boots a copy of its image that no other machine writes,
    # and names the runner of it `blacksmith-<label>-<id>`.
    - name: Refuse a machine that outlives the job
      shell: bash
      run: |
        if [ -n "${RUNS_ON_INSTANCE_ID:-}" ]; then
          echo "This machine is the RunsOn instance $RUNS_ON_INSTANCE_ID, which RunsOn discards after the job."
          exit 0
        fi
        if [[ "${RUNNER_NAME:-}" == blacksmith-* ]]; then
          echo "This machine is the Blacksmith runner $RUNNER_NAME, which Blacksmith discards after the job."
          exit 0
        fi
        echo "::error::The install.sh tests change the machine they run on and need a machine discarded after the job: a RunsOn instance or a Blacksmith runner. ${RUNNER_NAME:-This runner} is neither."
        exit 1

    # A peppy CI image (peppy-ubuntu24, peppy-ubuntu24-aarch64) and a release
    # host are provisioned for builds with setup_machine.sh, which puts on the
    # machine packages (fuse2fs, uidmap) that install.sh is there to install.
    # That script also installs pixi, which no stock image carries, so a pixi
    # found before the step that installs one below is the trace of that
    # provisioning.
    - name: Refuse a machine provisioned for builds
      shell: bash
      run: |
        if command -v pixi > /dev/null || [ -x "$HOME/.pixi/bin/pixi" ]; then
          echo "::error::The install.sh tests start from a machine that a user starts from, and ${RUNNER_NAME:-this runner} carries pixi: it boots a peppy CI image, or a step before this action provisioned it for builds. Boot a stock image."
          exit 1
        fi

    # The tests look for the archive where a release build writes it.
    - uses: actions/download-artifact@v8.0.2
      with:
        name: ${{ inputs.archive }}
        path: dist

    - if: inputs.hub-set != ''
      uses: actions/download-artifact@v8.0.2
      with:
        name: ${{ inputs.hub-set }}
        path: ${{ runner.temp }}/hub-set

    # pixi only, for the Python environment the tests run in. Nothing a
    # release build needs is installed: the tests start from the image as a
    # user's machine would, and a build toolchain would put packages on it
    # (fuse2fs, uidmap) that install.sh is there to install. Pinned to the
    # version the CI image is provisioned with. The pixi installer downloads
    # pixi with no retry of its own, so run_installer.sh runs it again when it
    # fails.
    - name: Install pixi
      shell: bash
      run: |
        PIXI_VERSION=v0.80.0 ./scripts/run_installer.sh https://pixi.sh/install.sh
        echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

    # PEPPY_INSTALL_TEST_HUB_SET names the hub set to the quickstart test (see
    # pin_default_hubs in scripts/tests/install_helpers.py).
    - name: Run the install.sh tests
      shell: bash
      env:
        PEPPY_DISPOSABLE_TEST_HOST: "1"
        PEPPY_INSTALL_TEST_HUB_SET: ${{ inputs.hub-set != '' && format('{0}/hub-set/hub-set.json', runner.temp) || '' }}
      run: ./scripts/run_tests.sh -m install
