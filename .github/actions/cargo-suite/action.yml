name: Cargo test suite
description: >-
  Runs one cargo test command against a peppy data root private to the job,
  then proves the build consumed the committed lockfile. Expects the Rust
  toolchain, and whatever else the suite builds against, to be in place.

inputs:
  command:
    description: The cargo command that runs the suite.
    required: true
  working-directory:
    description: >-
      The workspace the command runs in, relative to the repository root. Its
      Cargo.lock is the one proven untouched.
    default: .

runs:
  using: composite
  steps:
    # The suite gets its own peppy data root under the runner's temp dir, so
    # what the tests write stays off the sticky disk that holds ~/.peppy/tmp
    # (see the cargo-cache action). Only the cargo command opts in via env;
    # the release scripts job never goes through this action, so
    # scripts/install.sh keeps defaulting PEPPY_HOME to $HOME/.peppy.
    - name: Run the suite in an isolated peppy data root
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        peppy_home="$RUNNER_TEMP/peppy-home"
        mkdir -p "$peppy_home/tmpdir"
        export PEPPY_HOME="$peppy_home" TMPDIR="$peppy_home/tmpdir"
        ${{ inputs.command }}

    # Proves the build consumed the committed lockfile rather than re-resolving
    # it, so the tested dependency graph is the shipped one. Must stay after the
    # suite: placed before it, it proves nothing.
    - name: Prove CI did not rewrite the shipping lockfile
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: git diff --exit-code -- Cargo.lock
