name: Rust toolchain
description: >-
  Installs current stable Rust and makes it the default. The runner image's
  toolchain trails this repository's dependency graph (sysinfo already requires
  a newer rustc than the image ships), so a job pins itself here rather than
  inheriting the image default. Must precede every cargo step.

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        rustc --version
