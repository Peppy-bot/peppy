name: Release host environment
description: >-
  Prepares a runner for a stage of scripts/parallel_release.sh: pixi for the
  release scripts and, on request, what a cargo release build needs, the
  Claude CLI, and a git author for the commits the stage makes.

inputs:
  rust:
    description: >-
      Install what a cargo release build needs: the Rust toolchain and uv,
      plus on Linux the apptainer build dependencies
    default: "true"
  claude:
    description: Install the Claude CLI, which runs the docs check and drafts the release notes
    default: "false"
  git-author:
    description: Make the user who started the run the author of the commits the stage makes
    default: "false"

runs:
  using: composite
  steps:
    # The release is the one workflow left on hosted runners, because it builds
    # for macOS and arm64 and the self-hosted box is a single Linux x86 one. A
    # hosted runner is a fresh image on every run and carries none of what
    # scripts/setup_machine.sh installs, whereas the self-hosted boxes have run
    # that script already — so this stage runs it on itself, and rust-build-env
    # below can then assume a provisioned host wherever it is used. The script
    # skips anything the image already ships, and being the single definition
    # of what a host needs, it keeps the release runners and the CI boxes from
    # drifting apart.
    - name: Provision the hosted runner
      if: inputs.rust == 'true' && runner.os == 'Linux'
      shell: bash
      run: "$GITHUB_WORKSPACE/scripts/setup_machine.sh"

    # Linux builds in the same environment as every cargo job of this
    # repository.
    - if: inputs.rust == 'true' && runner.os == 'Linux'
      uses: ./.github/actions/rust-build-env

    # Pinned to current stable rather than the runner image's default, as
    # scripts/setup_machine.sh does on the Linux hosts.
    - name: Install the Rust toolchain
      if: inputs.rust == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        rustc --version

    # Pinned to the version scripts/setup_machine.sh installs, which is the one
    # that satisfies every `requires-pixi` in the workspace.
    - name: Install pixi
      if: inputs.rust != 'true' || runner.os != 'Linux'
      shell: bash
      run: |
        curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.80.0 sh
        echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

    # The bindings stage builds peppylib-py, whose build script refuses to
    # start without uv on PATH, and the macOS image ships none. Installed as
    # scripts/setup_machine.sh installs it on the Linux hosts.
    - name: Install uv
      if: inputs.rust == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Install the Claude CLI
      if: inputs.claude == 'true'
      shell: bash
      run: |
        curl -fsSL https://claude.ai/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Configure the commit author
      if: inputs.git-author == 'true'
      shell: bash
      env:
        ACTOR: ${{ github.actor }}
        ACTOR_ID: ${{ github.actor_id }}
      run: |
        git config user.name "$ACTOR"
        git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
