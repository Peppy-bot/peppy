name: Release host environment
description: >-
  Prepares a runner for a stage of scripts/parallel_release.sh: the toolchain
  a release build needs and, on request, the Claude CLI and a git author for
  the commits the stage makes.

inputs:
  claude:
    description: Install the Claude CLI, which runs the docs check and drafts the release notes
    default: "false"
  git-author:
    description: Make the user who started the run the author of the commits the stage makes
    default: "false"

runs:
  using: composite
  steps:
    # The macOS image taps Homebrew repositories of its own, and Homebrew
    # reads a tap only after someone trusts it. It lists the taps nobody
    # trusted each time it installs, and the runner turns that list into a
    # warning annotation on the release run, raised by the `brew install` the
    # script below does.
    #
    # A release stage installs from Homebrew's own taps only, so the image's
    # other taps give this run nothing but that notice. Their clones go, and
    # so does the clone of any tap a later image adds. The clones are deleted
    # rather than untapped because `brew untap` refuses a tap whose formulae
    # the image installed, and `brew untap --force` reports that in a warning
    # annotation of its own.
    - name: Drop the Homebrew taps a release never installs from
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        taps="$(brew tap | grep -v '^homebrew/' || true)"
        library="$(brew --repository)/Library/Taps"
        for tap in $taps; do
          rm -rf "$library/${tap%%/*}/homebrew-${tap#*/}"
        done

    # The release is the one workflow on hosted runners, because it builds for
    # macOS and arm64 while the rest of CI runs on self-hosted boxes that are
    # provisioned before they take a job. A hosted runner is a fresh image
    # each run, so this is where a release stage installs what it builds with.
    #
    # It installs it with the very script those boxes are provisioned by, so
    # the two cannot drift. They did: this step used to carry a hand-written
    # copy of the package list and the toolchain installs, the shared script
    # grew Go, and the release then failed on the one runner image that ships
    # none — "blacksmith-16vcpu-ubuntu-2404-arm ... is missing go", raised by
    # rust-build-env below, which checks what the shared script installs.
    #
    # The script lives in a gist because the other repository that provisions
    # with it, the Peppy superproject, is private and this one is public. It
    # is fetched rather than vendored for the same reason the boxes run it:
    # one copy, edited in one place. --build-only is the subset a release
    # stage needs (the apptainer build dependencies, Rust with clippy, Go,
    # pixi and uv) and leaves out what only a full development machine or a
    # self-hosted runner uses, qemu, Node, Docker and the rest among them.
    #
    # The script names its install directories on $GITHUB_PATH itself, so the
    # steps after this one find what it installed.
    - name: Provision this host the way the self-hosted boxes are provisioned
      shell: bash
      env:
        SETUP_MACHINE_URL: https://gist.githubusercontent.com/godardt/b20a8817e2991eba0bd0d613855627e0/raw/setup_machine.sh
      run: |
        set -euo pipefail
        curl -fsSL --retry 3 --retry-connrefused "$SETUP_MACHINE_URL" |
          bash -s -- --build-only

    # Linux builds in the same environment as every cargo job of this
    # repository, which is also what checks the step above left a complete
    # one. macOS has no equivalent: apptainer is built in a Lima guest there,
    # and the two pieces of host state this prepares are the guest's.
    - if: runner.os == 'Linux'
      uses: ./.github/actions/rust-build-env

    - name: Install the Claude CLI
      if: inputs.claude == 'true'
      shell: bash
      run: |
        curl -fsSL https://claude.ai/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Configure the commit author
      if: inputs.git-author == 'true'
      shell: bash
      env:
        ACTOR: ${{ github.actor }}
        ACTOR_ID: ${{ github.actor_id }}
      run: |
        git config user.name "$ACTOR"
        git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
