name: Release host environment
description: >-
  Prepares a runner for a stage of scripts/parallel_release.sh: pixi for the
  release scripts and, on request, what a cargo release build needs, the
  Claude CLI, and a git author for the commits the stage makes.

inputs:
  rust:
    description: >-
      Install what a cargo release build needs: the Rust toolchain, plus on
      Linux the apptainer build dependencies
    default: "true"
  claude:
    description: Install the Claude CLI, which runs the docs check and drafts the release notes
    default: "false"
  git-author:
    description: Make the user who started the run the author of the commits the stage makes
    default: "false"

runs:
  using: composite
  steps:
    # Linux builds in the same environment as every cargo job of this
    # repository, which installs pixi too.
    - if: inputs.rust == 'true' && runner.os == 'Linux'
      uses: ./.github/actions/rust-build-env

    # Pinned to current stable rather than the runner image's default, as
    # rust-build-env does on Linux.
    - name: Install the Rust toolchain
      if: inputs.rust == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        rustc --version

    # Pinned to the version scripts/pixi.toml requires.
    - name: Install pixi
      if: inputs.rust != 'true' || runner.os != 'Linux'
      shell: bash
      run: |
        curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.72.0 sh
        echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

    - name: Install the Claude CLI
      if: inputs.claude == 'true'
      shell: bash
      run: |
        curl -fsSL https://claude.ai/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Configure the commit author
      if: inputs.git-author == 'true'
      shell: bash
      env:
        ACTOR: ${{ github.actor }}
        ACTOR_ID: ${{ github.actor_id }}
      run: |
        git config user.name "$ACTOR"
        git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
