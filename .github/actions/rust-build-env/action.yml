name: Rust build environment
description: >-
  Puts the toolchain the host is provisioned with on PATH and checks it is
  there, then prepares the two pieces of host state apptainer needs: permission
  to create unprivileged user namespaces, and enough loop devices to mount
  several images at once.

runs:
  using: composite
  steps:
    # A job that checks out sparsely leaves this workspace sparse for the job
    # after it. actions/checkout writes core.sparseCheckout into the
    # repository's local config, `git sparse-checkout disable` clears it in the
    # worktree config, and checkout then unsets extensions.worktreeConfig — so
    # git reads the local `true` again, with .git/info/sparse-checkout still
    # beside it. On a runner discarded with the job none of that survives; on
    # these boxes one workspace serves every job of this repository, and the
    # next one is handed a partial tree while git calls it clean.
    #
    # That cost a run on 2026-09-18: release-scripts stopped at
    # "./scripts/run_tests.sh: No such file or directory" and container-e2e at
    # "could not find `Cargo.toml`", each on a box whose checkout had just
    # reported success, and each blaming the file it could not see rather than
    # the job before it.
    #
    # Only the workspace checkout is repaired. A job that wants a partial tree
    # takes it in a directory of its own (see peppy-shared), which this leaves
    # alone.
    - name: Repair a workspace an earlier job left sparse
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        git rev-parse --git-dir > /dev/null 2>&1 || exit 0
        # Exits 128 with "this worktree is not sparse", which is the ordinary
        # case and says nothing.
        git sparse-checkout list > /dev/null 2>&1 || exit 0
        echo "::warning::${RUNNER_NAME:-this runner} handed this job a sparse" \
          "workspace left by an earlier one; restoring the full checkout."
        git sparse-checkout disable || true
        git config --unset-all core.sparseCheckout || true
        rm -f "$(git rev-parse --git-dir)/info/sparse-checkout"
        git checkout --force HEAD

    # Nothing here installs a toolchain. A box that runs these suites is
    # provisioned before it takes a job, by setup_machine.sh --ci-runner, and
    # a box missing any of it is a provisioning failure to fix once on that
    # box. The one caller whose host is a fresh image each run is
    # release-host-env, which runs the same script with --build-only before
    # this action, so what it leaves behind is what is checked below.
    #
    # What a job does have to do is PATH. The runner executes steps in a shell
    # that is neither a login nor an interactive one, so the profile edits the
    # installers make are never sourced, and the tools under $HOME and
    # /usr/local/go have to be named on $GITHUB_PATH to be reachable from the
    # calling job's later steps.
    #
    # The check is there to name a gap in one line instead of letting it become
    # an error minutes later inside a build script, where it reads as something
    # else entirely: no `pixi` is generator-internal refusing to serve a stale
    # peppylib .so, no `go` is apptainer's mconfig stopping at "host Go
    # compiler ... not found!", and no clippy is the generator suites failing
    # rather than skipping a lint (their test helpers run `cargo clippy
    # --all-targets -- -D warnings` over the crate they generate). Must stay
    # ahead of every cargo step.
    - name: Check the host's toolchain
      shell: bash
      run: |
        set -euo pipefail
        for dir in "$HOME/.cargo/bin" /usr/local/go/bin "$HOME/.pixi/bin" "$HOME/.local/bin"; do
          if [ -d "$dir" ]; then
            echo "$dir" >> "$GITHUB_PATH"
          fi
        done
        # $GITHUB_PATH reaches the next step, not this one, so the checks below
        # need the same directories on PATH here.
        export PATH="$HOME/.cargo/bin:/usr/local/go/bin:$HOME/.pixi/bin:$HOME/.local/bin:$PATH"
        missing=()
        for tool in rustc cargo go pixi uv; do
          command -v "$tool" > /dev/null || missing+=("$tool")
        done
        cargo clippy --version > /dev/null 2>&1 || missing+=("clippy")
        if [ ${#missing[@]} -gt 0 ]; then
          list=$(printf '%s, ' "${missing[@]}")
          echo "::error::${RUNNER_NAME:-this host} is missing ${list%, }." \
            "Hosts are provisioned with setup_machine.sh:" \
            "https://gist.github.com/godardt/b20a8817e2991eba0bd0d613855627e0" \
            "(--ci-runner on a self-hosted box, --build-only on a release runner)."
          exit 1
        fi
        rustc --version
        go version
        pixi --version
        uv --version

    # Apptainer is built without setuid and creates its user namespaces
    # unprivileged, through fakeroot. Ubuntu 24.04 ships
    # kernel.apparmor_restrict_unprivileged_userns=1, which denies that to any
    # binary without a matching AppArmor profile, so every test that builds or
    # runs a container fails with "Apptainer's user namespace prerequisites are
    # not met" and a fix script naming the starter binary. Clearing the knob is
    # what peppy itself does inside the Lima guest it provisions (see
    # apptainer/lima.rs); the alternative, the per-installation AppArmor
    # profile, is keyed to the path of the install's starter binary and would
    # have to be rewritten for every apptainer version the build cache holds.
    #
    # Set per job rather than in the host's provisioning because it does not
    # survive a reboot, and a box that came back up without it fails every
    # container suite on it. A kernel that never had the restriction (Ubuntu
    # 22.04) has no knob to clear, hence the existence check.
    - name: Allow unprivileged user namespaces
      shell: bash
      run: |
        knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
        if [ ! -e "$knob" ]; then
          echo "kernel does not restrict unprivileged user namespaces"
          exit 0
        fi
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    # Apptainer mounts every SIF image through a /dev/loopN node, and a host
    # materializes only loop0 through loop7 by default. The container tests and
    # the multi-daemon e2e run several containers at once, and the ninth
    # concurrent mount dies with "could not open /dev/loop8: no such file or
    # directory". Create the remaining nodes up front; the loop major is 7 and
    # the kernel accepts device nodes whether or not udev would have made them.
    # Like the knob above these are lost on reboot, so they are made here; on a
    # box that has already run a container suite since booting, every one of
    # them exists and the loop does nothing.
    - name: Create loop devices for parallel container mounts
      shell: bash
      run: |
        for i in $(seq 8 63); do
          [ -e "/dev/loop$i" ] || sudo mknod -m 660 "/dev/loop$i" b 7 "$i"
        done
