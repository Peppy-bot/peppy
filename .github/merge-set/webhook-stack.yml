AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The webhook of the merge-set App of Peppy-bot, which starts the Merge set
  workflow of peppy for each event that can change a set (see
  .github/merge-set/webhook.py in Peppy-bot/peppy).

# A user with the administrator role in the account deploys this stack from a
# checkout of peppy:
#
#   aws cloudformation deploy --region us-east-1 \
#     --stack-name peppy-merge-set-webhook \
#     --template-file .github/merge-set/webhook-stack.yml \
#     --capabilities CAPABILITY_NAMED_IAM
#
# The stack holds no code of the function: the Merge set webhook workflow of
# peppy (.github/workflows/merge-set-webhook.yml) deploys it from `dev`, with
# the deploy role of this stack.

Parameters:
  AppClientId:
    Type: String
    Description: The client ID of the merge-set App, the issuer of its JWT.
    Default: Iv23liYUhUWXVWpD711x
  AppSlug:
    Type: String
    Description: The slug of the merge-set App, which names its bot user.
    Default: peppy-merge-set
  GitHubOidcProviderArn:
    Type: String
    Description: >-
      The IAM OIDC provider of GitHub Actions in this account, if the account
      has one. When it is empty, the stack makes it.
    Default: ""

Conditions:
  MakeGitHubOidcProvider: !Equals [!Ref GitHubOidcProviderArn, ""]

Resources:
  # The private key of the App, which import-app-key.sh imports. The key
  # policy lets the function alone sign with it: an administrator of the
  # account can manage the key but cannot sign as the App.
  AppKey:
    Type: AWS::KMS::Key
    Properties:
      Description: The private key of the merge-set GitHub App
      KeySpec: RSA_2048
      KeyUsage: SIGN_VERIFY
      Origin: EXTERNAL
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: TheAccountManagesTheKey
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            NotAction: kms:Sign
            Resource: "*"
          - Sid: TheFunctionSignsTheJwtOfTheApp
            Effect: Allow
            Principal:
              AWS: !GetAtt FunctionRole.Arn
            Action: kms:Sign
            Resource: "*"
            Condition:
              StringEquals:
                "kms:SigningAlgorithm": RSASSA_PKCS1_V1_5_SHA_256

  AppKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/peppy-merge-set-app
      TargetKeyId: !Ref AppKey

  # The secret that GitHub signs each delivery with. The App settings hold a
  # copy of it.
  WebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: peppy-merge-set/webhook-secret
      Description: The webhook secret of the merge-set GitHub App
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/peppy-merge-set-webhook
      RetentionInDays: 30

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: peppy-merge-set-webhook
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: webhook
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt FunctionLogGroup.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref WebhookSecret

  # A delivery takes a few API calls, and GitHub waits 10 seconds for the
  # answer. At most 10 deliveries run at once, which bounds the cost of a
  # flood of requests: the function refuses each one without a valid
  # signature before it does anything else.
  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: peppy-merge-set-webhook
      Description: The webhook of the merge-set GitHub App
      Runtime: python3.14
      Architectures:
        - arm64
      Handler: webhook.lambda_handler
      MemorySize: 512
      Timeout: 30
      ReservedConcurrentExecutions: 10
      Role: !GetAtt FunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref FunctionLogGroup
      Environment:
        Variables:
          APP_CLIENT_ID: !Ref AppClientId
          APP_SLUG: !Ref AppSlug
          APP_KEY_ID: !GetAtt AppKey.Arn
          WEBHOOK_SECRET_ARN: !Ref WebhookSecret
      Code:
        ZipFile: |
          # The Merge set webhook workflow of peppy replaces this file with
          # the archive of .github/merge-set/webhook.py.

  # GitHub cannot sign a request for AWS, so the URL is public, and the
  # function checks the signature of the webhook secret on each delivery.
  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE

  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # The role of the Merge set webhook workflow: only a job of peppy in the
  # `merge-set-webhook` environment, which only `dev` reaches, gets it, and it
  # can only replace the code of the function.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: peppy-merge-set-webhook-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": "repo:Peppy-bot/peppy:environment:merge-set-webhook"
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionUrlConfig
                Resource: !GetAtt Function.Arn

Outputs:
  FunctionUrl:
    Description: The webhook URL of the App settings.
    Value: !GetAtt FunctionUrl.FunctionUrl
  WebhookSecretArn:
    Description: The secret to copy into the App settings.
    Value: !Ref WebhookSecret
  AppKeyId:
    Description: The KMS key that import-app-key.sh imports the key of the App into.
    Value: !Ref AppKey
  DeployRoleArn:
    Description: The role of the Merge set webhook workflow of peppy.
    Value: !GetAtt DeployRole.Arn
