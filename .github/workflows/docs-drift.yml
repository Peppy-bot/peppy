name: Docs drift

# Runs only for the release PR that merges `dev` into `main`. The base-branch
# filter restricts to PRs targeting `main`; the job-level `if` further restricts
# the head to `dev`, so unrelated PRs into `main` (or any PR into other branches)
# never trigger it. PR-only by design: on a `push` event the
# `github.event.pull_request.*` context is empty, which would feed the scripts
# garbage refs.
on:
  pull_request:
    types: [opened, reopened]
    branches: [ main ]

concurrency:
  group: docs-drift-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-drift:
    if: github.head_ref == 'dev'
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    outputs:
      docs-outdated: ${{ steps.check.outcome == 'failure' }}

    steps:
      - name: Isolate git global config from runner user
        run: |
          : > "$RUNNER_TEMP/peppy-gitconfig"
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/peppy-gitconfig" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          # Safe here even though this job opens a PR: the
          # peter-evans/create-pull-request step below is handed its own
          # PEPPY_BOT_TOKEN and never relies on the ambient checkout credential.
          persist-credentials: false

      - name: Check docs are up to date
        id: check
        continue-on-error: true
        run: |
          pixi run --manifest-path scripts is-doc-up-to-date \
            "origin/${{ github.base_ref }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Update docs
        if: steps.check.outcome == 'failure'
        run: |
          pixi run --manifest-path scripts update-docs \
            "origin/${{ github.base_ref }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Open follow-up PR against contributor branch
        if: steps.check.outcome == 'failure'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PEPPY_BOT_TOKEN }}
          branch: auto/docs-update-${{ github.event.pull_request.number }}
          base: ${{ github.event.pull_request.head.ref }}
          title: "docs: sync with PR #${{ github.event.pull_request.number }}"
          body: |
            Automated doc update generated by `scripts/docs/update_docs.py`
            in response to code changes in #${{ github.event.pull_request.number }}.
          commit-message: "docs: auto-sync with code changes"
          add-paths: docs/**
