name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: self-hosted
    container:
      image: rust:latest
      options: --user 1001:1001

    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test
