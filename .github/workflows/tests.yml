name: Tests

# A push to dev runs the suites the merge touched, like a pull request does,
# and that run is what writes dev's build caches: a pull request's run reads
# them but never writes them back (see below).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI does the full cross-platform peppylib build: cross-compile the .so for
  # every Linux arch. A plain `cargo build` leaves this unset and, like a Linux
  # build, produces only the host dynamic lib, so local dev builds stay fast; the
  # release path and CI turn it on. On a warm build cache this is a no-op (present,
  # fresh artifacts are reused); it only pays the cross-build cost when the cache
  # is cold. Cross-arch apptainer is separate, gated by PEPPY_CROSS_ARCH.
  PEPPY_CROSS_BUILD: "1"

# Every suite runs in a job of its own, so the workflow finishes with its
# slowest suite rather than the sum of them. Every suite is gated on its inputs
# by the changes job and waits for that job alone, never for another suite.
#
# Every job but one runs on a RunsOn runner: an EC2 instance of its own, booted
# from the peppy-ubuntu24 image for the job and discarded after it, sized by
# the job's runs-on label. The gates take 2 vCPU. The cargo suites take 16
# vCPU with 2 GB each (the heaviest suite peaks near 11 GB), on the current
# AMD and Intel compute-optimized families (the fastest compiles, over enough
# spot pools that a spot instance is found at once), and a root disk that
# holds a suite's scratch under RUNNER_TEMP (the multi-daemon suite's Docker
# and apptainer images peak near 45 GB there). The
# shapes are labels on the org runner rather than a runner of
# .github/runs-on.yml because RunsOn reads that file from dev only, so a pull
# request could not change or test them.
#
# Each cargo job keeps its build cache on a sticky disk of its own (the
# cargo-cache action): the target directory as the suite's last run left it,
# the cargo registry and the build scripts' tool cache, so it compiles only
# what the change touched. RunsOn restores the newest snapshot of that disk
# taken on the same branch, or on dev when the branch has none, and never
# writes a pull request's run back to dev. A pull request from a fork runs on
# the same runners, so what holds fork code is the repository's fork-PR
# approval policy, which holds every outside contributor's run until a
# maintainer approves it.
#
# The exception is install-script, which runs install.sh on a GitHub-hosted
# runner. install.sh changes the machine it runs on (apt packages, systemd
# linger, an AppArmor profile, a user service), and the tests must start from
# the stock Ubuntu image a user starts from, which the CI image, provisioned
# for builds, is not.
jobs:
  # What the change set requires each gated job to run: a boolean for the jobs
  # that are all or nothing, and a package selection for the job that splits
  # into units testable on their own. The dependency graph behind the selection
  # is read from the manifests at run time (see the action), so added or
  # rewired crates are picked up with nothing to maintain here. A job whose
  # whole selection is empty is skipped, and the action reports the reason in
  # this job's annotations and summary.
  changes:
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=2/ram=4+8  # custom Peppy AMI
    permissions:
      contents: read
    outputs:
      workspace: ${{ steps.changes.outputs.workspace }}
      container_e2e: ${{ steps.changes.outputs.container_e2e }}
      multi_daemon_e2e: ${{ steps.changes.outputs.multi_daemon_e2e }}
      docs_integration: ${{ steps.changes.outputs.docs_integration }}
      cross_check: ${{ steps.changes.outputs.cross_check }}
      scripts: ${{ steps.changes.outputs.scripts }}
      install_script: ${{ steps.changes.outputs.install_script }}
      peppy_shared_packages: ${{ steps.changes.outputs.peppy_shared_packages }}
      peppy_shared_peppylib_py: ${{ steps.changes.outputs.peppy_shared_peppylib_py }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The detection diffs the branch against its base, so both sides of
          # the history must be present.
          fetch-depth: 0
          # Nothing in this workflow pushes, so no job has a use for a writable
          # credential sitting in .git/config for every later step to inherit.
          persist-credentials: false

      # The detection queries cargo metadata, and the action is what puts the
      # image's cargo on PATH.
      - uses: ./.github/actions/rust-build-env

      # What this job decides is which suites run at all, so the decision is
      # tested before it is trusted. The cases read this repository's real
      # manifests and need nothing installed beyond the toolchain above.
      - name: Test the detection
        run: |
          python3 -m unittest discover \
            --start-directory .github/actions/changed-test-inputs \
            --pattern 'test_*.py' --verbose

      - name: Detect changed test inputs
        id: changes
        uses: ./.github/actions/changed-test-inputs
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}

  # The unit and integration tests of every default member of the workspace:
  # `crates/*`, with the docs integration tests left to their own job below.
  workspace-tests:
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=16/ram=32/family=c7a+c7i+c8a+c8i/volume=150gb:gp3:500mbs:6000iops/sticky=workspace-tests:80gb  # custom Peppy AMI
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Puts the image's toolchain on PATH and prepares the host state
      # apptainer needs. Must precede every cargo step.
      - uses: ./.github/actions/rust-build-env

      - uses: ./.github/actions/cargo-cache
        with:
          suite: workspace-tests

      - uses: ./.github/actions/cargo-suite
        with:
          command: cargo test --locked

  container-e2e:
    needs: changes
    if: needs.changes.outputs.container_e2e == 'true'
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=16/ram=32/family=c7a+c7i+c8a+c8i/volume=150gb:gp3:500mbs:6000iops/sticky=container-e2e:30gb  # custom Peppy AMI
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/rust-build-env

      - uses: ./.github/actions/cargo-cache
        with:
          suite: container-e2e

      - uses: ./.github/actions/cargo-suite
        with:
          command: cargo test --locked -p core-node --features container_e2e --test container_e2e

  multi-daemon-e2e:
    needs: changes
    if: needs.changes.outputs.multi_daemon_e2e == 'true'
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=16/ram=32/family=c7a+c7i+c8a+c8i/volume=150gb:gp3:500mbs:6000iops/sticky=multi-daemon-e2e:40gb  # custom Peppy AMI
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/rust-build-env

      - uses: ./.github/actions/cargo-cache
        with:
          suite: multi-daemon-e2e

      # The suite builds its daemon image through `docker buildx build` (see
      # build_e2e_daemon_image), which resolves the default builder of the
      # runner's own Docker daemon. The runner starts with an empty layer
      # cache, so every run builds the apt and uv-python layers.
      - uses: ./.github/actions/cargo-suite
        with:
          command: cargo test --locked -p peppy --features multi_daemon_e2e --test multi_daemon_e2e

  docs-integration:
    needs: changes
    if: needs.changes.outputs.docs_integration == 'true'
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=16/ram=32/family=c7a+c7i+c8a+c8i/volume=150gb:gp3:500mbs:6000iops/sticky=docs-integration:50gb  # custom Peppy AMI
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/rust-build-env

      - uses: ./.github/actions/cargo-cache
        with:
          suite: docs-integration

      # The snippet node tests run cargo offline
      # (snippet_runner::run_cargo_node_tests) and resolve against the registry
      # cache. This suite's own build fetches only the crates it links, and a
      # synced node's dev-dependencies reach further: peppygen's `testing`
      # feature turns on peppylib's, whose crates (ctor among them) only a
      # workspace member's test build pulls in. Fetching the whole lockfile
      # puts every crate the workspace resolves into the cache, which is what
      # a synced node can count on.
      - name: Fetch every crate in the lockfile for the offline snippet builds
        run: cargo fetch --locked

      - uses: ./.github/actions/cargo-suite
        with:
          command: cargo test --locked -p docs-integration-tests

  # The release scripts test in two halves because they cost orders of
  # magnitude apart. This job runs the mocked tests, about a second for all of
  # them, on any change under scripts/. The install.sh tests need a release
  # archive and a fresh machine, so they run in install-archive and
  # install-script, gated on the far narrower set of files that decide what
  # gets installed and how.
  release-scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=2/ram=4+8  # custom Peppy AMI
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Provides the pixi the suite runs under.
      - uses: ./.github/actions/rust-build-env

      - name: Run the mocked release scripts tests
        run: ./scripts/run_tests.sh -m 'not install'

  # Builds the release archive the install.sh tests install, from this
  # change, the way a release host builds it, with the release target
  # directory, the cargo registry and the tool cache on the job's sticky disk.
  # The job that installs the archive needs the stock Ubuntu image, so the
  # two are separate jobs.
  install-archive:
    needs: changes
    if: needs.changes.outputs.install_script == 'true'
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=16/ram=32/family=c7a+c7i+c8a+c8i/volume=150gb:gp3:500mbs:6000iops/sticky=install-archive:50gb  # custom Peppy AMI
    permissions:
      contents: read
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-build-env

      - uses: ./.github/actions/cargo-cache
        with:
          suite: install-archive

      - name: Build the release archive of this runner's platform
        run: ./scripts/build_release.sh --local --tag test

      # The installing job runs on ubuntu-24.04, so this runner must build the
      # x86_64 archive; a runner of another architecture fails here, by name.
      - uses: actions/upload-artifact@v7
        with:
          name: install-archive
          path: dist/peppy-x86_64-unknown-linux-gnu.tgz
          if-no-files-found: error
          retention-days: 1

  # Installs that archive with this change's install.sh on a fresh Ubuntu
  # x86_64 runner, and runs the container path of install.sh in Docker (see
  # the install-test action). The release workflow runs the same tests on
  # every platform before it publishes; this job is the early warning for
  # the one platform a pull request can build cheaply.
  install-script:
    needs: install-archive
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-test
        with:
          archive: install-archive

  # The sealed peppy-shared tree: the cargo packages of its workspace together
  # with the peppylib Python bindings built from them. It runs the units the
  # change set reached and no others, named by the changes job, so a change to
  # one crate of the tree costs one crate's build rather than the tree's.
  #
  # The job checks out the tree and the CI plumbing and nothing else. The tree
  # may depend on nothing outside itself, and this checkout is where that is a
  # fact rather than a convention: with `crates/` and the root manifest absent,
  # a dependency, `#[path]` or `include!` reaching out of the tree has nothing
  # to resolve to and fails the build. The manifest-level rule has a test of
  # its own with a readable failure (build-helpers' sealed_tree).
  #
  # The root .gitignore is in the checkout because it is git plumbing for the
  # path down to the tree, not code: cargo fingerprints a build script by
  # listing its package's files through git, which evaluates the ignore rules
  # of every directory from the repository root down. A sparse checkout is a
  # partial clone, so a .gitignore left out of it has no blob to read and the
  # listing fails ("Failed to update the excludes stack").
  peppy-shared:
    needs: changes
    if: needs.changes.outputs.peppy_shared_packages != '' || needs.changes.outputs.peppy_shared_peppylib_py == 'true'
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=16/ram=32/family=c7a+c7i+c8a+c8i/volume=150gb:gp3:500mbs:6000iops/sticky=peppy-shared:40gb  # custom Peppy AMI
    permissions:
      contents: read

    steps:
      # The workspace checkout, whole: it carries the composite actions below.
      # Nothing of the tree under test is built from here.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tree under test, on its own, in a directory of its own, because
      # the workspace checkout above has to stay whole for the actions it
      # carries.
      #
      # The root .gitignore comes too, as git plumbing for the path down to
      # the tree rather than as code, for the reason above. `.github/` does
      # not: the actions are used from the workspace checkout above, and
      # leaving it out keeps this checkout to the tree and the one file it
      # needs.
      - uses: actions/checkout@v7
        with:
          path: sealed
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /peppy-shared/

      # Puts the image's toolchain on PATH, including the pixi and uv
      # peppylib-py's build script and suite reach for. The workspace is pure
      # Rust plus the peppylib extension: nothing in it builds apptainer or
      # runs a container, so that is the whole environment.
      - uses: ./.github/actions/rust-build-env

      - uses: ./.github/actions/cargo-cache
        with:
          suite: peppy-shared
          target-dir: sealed/peppy-shared/target

      # peppylib-py is never in the selection: its cdylib build and
      # tests/python_tests.rs only wrap `pixi run test`, which the step below
      # runs directly. The lockfile is workspace-global, so `--locked` still
      # validates it against every member's manifest, peppylib-py included.
      - uses: ./.github/actions/cargo-suite
        if: needs.changes.outputs.peppy_shared_packages != ''
        with:
          working-directory: sealed/peppy-shared
          command: cargo test --locked ${{ needs.changes.outputs.peppy_shared_packages }}

      # `pixi run test` builds the native module with `maturin develop` and
      # runs the pytest suite. The install goes first and `--locked`, so a
      # stale pixi.lock fails here instead of being re-resolved by the run.
      # This suite runs whatever the one above did, so one red suite never
      # hides another.
      - name: Run the peppylib-py Python tests
        if: ${{ !cancelled() && needs.changes.outputs.peppy_shared_peppylib_py == 'true' }}
        working-directory: sealed/peppy-shared/peppylib-py
        run: |
          peppy_home="$RUNNER_TEMP/peppy-home-py"
          mkdir -p "$peppy_home/tmpdir"
          export PEPPY_HOME="$peppy_home" TMPDIR="$peppy_home/tmpdir"
          pixi install --locked
          pixi run test

      # The locked install above must have consumed the committed manifest and
      # lockfile, not rewritten them.
      - name: Prove the peppylib-py suite tested the committed manifest and lockfile
        if: ${{ !cancelled() && needs.changes.outputs.peppy_shared_peppylib_py == 'true' }}
        working-directory: sealed
        run: git diff --exit-code -- 'peppy-shared/*pixi.toml' 'peppy-shared/*pixi.lock'

  # Build scripts execute on the build host even when cargo compiles for
  # another target, so a build script that runs a binary selected by the
  # target triple only fails when host and target differ. The one cross build
  # in the pipeline is the release script's x86_64-unknown-linux-gnu build
  # inside an aarch64 Lima guest, which surfaces such a defect minutes into a
  # release instead of on the pull request that introduced it. This job checks
  # the release dependency tree under the mirrored mismatch (x86_64 host,
  # aarch64 target): `cargo check` runs every build script for real, and one
  # that executes a target-selected binary dies immediately with an exec
  # format error. Apptainer provisioning is skipped because a foreign-arch
  # apptainer needs a Lima VM or a pre-seeded cache and a check build never
  # runs containers.
  cross-check:
    needs: changes
    if: needs.changes.outputs.cross_check == 'true'
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=16/ram=32/family=c7a+c7i+c8a+c8i/volume=150gb:gp3:500mbs:6000iops/sticky=cross-check:20gb  # custom Peppy AMI
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-build-env

      # The aarch64 target and the cross gcc come from the CI image's
      # provisioning, as the rest of what this job builds with does, and this
      # is the one job that needs them. An image without them fails from inside
      # cargo, which reports a dependency that cannot find `core` rather than a
      # runner that was never given the target, so the gap is named here
      # instead. The
      # target list is captured before grep reads it: `grep -q` returns on the
      # first match and would leave rustup writing into a closed pipe.
      - name: Check the host's cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          targets=$(rustup target list --installed 2>/dev/null || true)
          grep -qx aarch64-unknown-linux-gnu <<< "$targets" ||
            missing+=("the aarch64 Rust target")
          command -v aarch64-linux-gnu-gcc > /dev/null ||
            missing+=("aarch64-linux-gnu-gcc")
          if [ ${#missing[@]} -gt 0 ]; then
            list=$(printf '%s, ' "${missing[@]}")
            echo "::error::${RUNNER_NAME:-this host} is missing ${list%, }." \
              "The CI image is provisioned with setup_machine.sh --ci-runner:" \
              "https://gist.github.com/godardt/b20a8817e2991eba0bd0d613855627e0"
            exit 1
          fi

      - uses: ./.github/actions/cargo-cache
        with:
          suite: cross-check

      # The linker matters even though `cargo check` itself never links:
      # pmi's build script cargo-installs zenohd for the target, a real
      # release build that links. Without the cross gcc as the target's
      # linker driver, the host cc runs the linker in x86_64 mode, which
      # rejects the aarch64-only flags rustc passes (the release script
      # sets the equivalent variable for its cross direction).
      - name: Cross-check the release dependency tree
        env:
          PEPPY_SKIP_APPTAINER_PROVISION: "1"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo check --locked --target aarch64-unknown-linux-gnu -p peppy

  # The one status check the branch rulesets on dev and main require. It is
  # green only when every job above succeeded or was gated off, so a red
  # suite blocks the merge whichever job it ran in.
  test:
    needs:
      - changes
      - workspace-tests
      - container-e2e
      - multi-daemon-e2e
      - docs-integration
      - release-scripts
      - install-archive
      - install-script
      - peppy-shared
      - cross-check
    # Runs whatever happened above: on the default condition a failed or
    # cancelled suite would leave this check unreported instead of red.
    if: always()
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=2/ram=4+8  # custom Peppy AMI
    permissions: {}

    steps:
      - name: Report every job's result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS"

      - name: Fail when any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
