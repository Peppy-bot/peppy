name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI does the full cross-platform peppylib build: cross-compile the .so for
  # every Linux arch. A plain `cargo build` leaves this unset and, like a Linux
  # build, produces only the host dynamic lib, so local dev builds stay fast; the
  # release path and CI turn it on. On a warm build cache this is a no-op (present,
  # fresh artifacts are reused); it only pays the cross-build cost when the cache
  # is cold. Cross-arch apptainer is separate, gated by PEPPY_CROSS_ARCH.
  PEPPY_CROSS_BUILD: "1"

# Every suite runs in a job of its own, so the workflow finishes with its
# slowest suite rather than the sum of them. Each cargo job builds in a cache
# directory of its own (the cargo-cache action) holding the target directory as
# the suite's last run left it, so it compiles only what the change touched; the
# cargo registry and the build scripts' tool cache are the reused runner's own
# and shared with every repository on it. The gated suites wait only for the
# changes job, never for another suite.
#
# Every job runs on a self-hosted runner; no job uses a GitHub-hosted one. Each
# runner is its own machine taking one job at a time, so as many suites run in
# parallel as there are boxes and the rest queue; a suite is warm or cold
# depending on which box it lands on, since the caches below are per-box. A
# pull request from a fork lands on those same boxes, so what keeps fork code
# away from them is the repository's fork-PR approval policy, which holds every
# outside contributor's run until a maintainer approves it.
jobs:
  # What the change set requires each gated job to run: a boolean for the jobs
  # that are all or nothing, and a selection of packages or directories for the
  # jobs that split into units testable on their own. The dependency graph
  # behind the selection is read from the manifests at run time (see the
  # action), so added or rewired crates and libraries are picked up with
  # nothing to maintain here. A job whose whole selection is empty is skipped,
  # and the action reports the reason in this job's annotations and summary.
  changes:
    runs-on: self-hosted
    permissions:
      contents: read
    outputs:
      container_e2e: ${{ steps.changes.outputs.container_e2e }}
      docs_integration: ${{ steps.changes.outputs.docs_integration }}
      scripts: ${{ steps.changes.outputs.scripts }}
      scripts_vm: ${{ steps.changes.outputs.scripts_vm }}
      public_libs_shared_packages: ${{ steps.changes.outputs.public_libs_shared_packages }}
      public_libs_peppylib_py: ${{ steps.changes.outputs.public_libs_peppylib_py }}
      public_libs_crates: ${{ steps.changes.outputs.public_libs_crates }}
      public_libs_python: ${{ steps.changes.outputs.public_libs_python }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The detection diffs the branch against its base, so both sides of
          # the history must be present.
          fetch-depth: 0
          # Nothing in this workflow pushes, so no job has a use for a writable
          # credential sitting in .git/config for every later step to inherit.
          persist-credentials: false

      # The detection queries cargo metadata, and the action is what puts the
      # box's cargo on PATH.
      - uses: ./.github/actions/rust-build-env

      # What this job decides is which suites run at all, so the decision is
      # tested before it is trusted. The cases read this repository's real
      # manifests and need nothing installed beyond the toolchain above.
      - name: Test the detection
        run: |
          python3 -m unittest discover \
            --start-directory .github/actions/changed-test-inputs \
            --pattern 'test_*.py' --verbose

      # The other piece of this workflow's own Python, tested in the one job
      # that runs on every event: it deletes caches off the box, so what it
      # takes and what it leaves is held to cases rather than to a reading.
      - name: Test the disk reclaim
        run: |
          python3 -m unittest discover \
            --start-directory .github/actions/reclaim-cache-disk \
            --pattern 'test_*.py' --verbose

      - name: Detect changed test inputs
        id: changes
        uses: ./.github/actions/changed-test-inputs
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}

  workspace-tests:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Puts the box's toolchain on PATH and prepares the host state apptainer
      # needs. Must precede every cargo step.
      - uses: ./.github/actions/rust-build-env

      - uses: ./.github/actions/cargo-cache
        with:
          suite: workspace-tests

      - uses: ./.github/actions/cargo-suite
        with:
          command: cargo test --locked

  container-e2e:
    needs: changes
    if: needs.changes.outputs.container_e2e == 'true'
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/rust-build-env

      - uses: ./.github/actions/cargo-cache
        with:
          suite: container-e2e

      - uses: ./.github/actions/cargo-suite
        with:
          command: cargo test --locked -p core-node --features container_e2e --test container_e2e

  multi-daemon-e2e:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/rust-build-env

      - uses: ./.github/actions/cargo-cache
        with:
          suite: multi-daemon-e2e

      # The suite builds its daemon image through `docker buildx build` (see
      # build_e2e_daemon_image), which resolves the default builder of the
      # runner's own Docker daemon. That buildkit instance and its layer cache
      # outlive the job, so the apt and uv-python layers are built once and
      # reused across runs with no builder to set up here.
      - uses: ./.github/actions/cargo-suite
        with:
          command: cargo test --locked -p peppy --features multi_daemon_e2e --test multi_daemon_e2e

  docs-integration:
    needs: changes
    if: needs.changes.outputs.docs_integration == 'true'
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/rust-build-env

      - uses: ./.github/actions/cargo-cache
        with:
          suite: docs-integration

      # The snippet node tests run cargo offline
      # (snippet_runner::run_cargo_node_tests) and resolve against the registry
      # cache. This suite's own build fetches only the crates it links, and a
      # synced node's dev-dependencies reach further: peppygen's `testing`
      # feature turns on peppylib's, whose crates (ctor among them) only a
      # workspace member's test build pulls in. Fetching the whole lockfile
      # puts every crate the workspace resolves into the cache, which is what
      # a synced node can count on.
      - name: Fetch every crate in the lockfile for the offline snippet builds
        run: cargo fetch --locked

      - uses: ./.github/actions/cargo-suite
        with:
          command: cargo test --locked -p docs-integration-tests

  # The release scripts test in two jobs because their two halves cost three
  # orders of magnitude apart. Measured on run 35394542148: 444 tests in
  # 891s, of which the 27 that boot a Lima guest took 890s and the other 417
  # took about one second between them. Running them together billed every
  # change under scripts/ -- a release-note wording fix included -- for three
  # guest boots.
  release-scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Provides the pixi the suite runs under.
      - uses: ./.github/actions/rust-build-env

      - name: Run the mocked release scripts tests
        run: ./scripts/run_tests.sh -m 'not vm'

  # The Lima half. Gated on the files that decide what a guest installs and
  # how (see TREE_SUITES in the changes action), and run unconditionally on
  # the way into main, so a promotion re-proves the install path even when the
  # narrow gate stayed shut on every pull request behind it.
  release-scripts-vm:
    needs: changes
    if: needs.changes.outputs.scripts_vm == 'true' || github.event_name == 'push'
    runs-on: self-hosted
    permissions:
      contents: read
    # Three guests, a release build and a container build. A healthy run is
    # about 15 minutes; the failure this bounds is the one that does not fail
    # at all, where a guest never finishes booting and the job sits for hours
    # holding a box (run 35394542148 was still going after one).
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Provides the pixi the suite runs under.
      - uses: ./.github/actions/rust-build-env

      # The install tests boot Lima VMs (limactl itself comes from the pixi
      # environment) on the runner's QEMU, which comes from the box's
      # provisioning. KVM access is set here because a reboot resets the
      # permission: it opens when present but group-inaccessible. Needs
      # passwordless sudo on the box.
      #
      # Without KVM Lima falls back to software emulation. That is not an
      # error and the suite still passes, which is the problem: it turns a
      # 15-minute job into an hours-long one and says nothing, so the box
      # reads as slow rather than as misprovisioned. Say it where it will be
      # read -- an annotation and the step summary -- rather than leaving it
      # to whoever next wonders why this job is the slowest thing in CI.
      - name: Open KVM to the runner, and say so when it is not there
        run: |
          if [ -e /dev/kvm ]; then
            if ! [ -r /dev/kvm -a -w /dev/kvm ]; then
              sudo chmod 666 /dev/kvm
            fi
            echo "KVM available: guests run at native speed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=No KVM on ${RUNNER_NAME:-this runner}::/dev/kvm is absent, so Lima falls back to software emulation. This job will take hours instead of ~15 minutes. The box needs KVM (nested virtualisation on a VPS) to run the install tests at a sane speed."
            {
              echo "### No KVM on ${RUNNER_NAME:-this runner}"
              echo
              echo "\`/dev/kvm\` is absent, so every guest boots under QEMU software"
              echo "emulation. Expect hours rather than ~15 minutes."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run the Lima install tests
        run: ./scripts/run_tests.sh -m vm

  # Three jobs test the sealed public-peppy-libs tree: the cargo packages of
  # its peppy-shared workspace together with the peppylib Python bindings
  # built from them, its standalone crates, and its standalone Python
  # libraries. Each runs the units the change set reached and no others, named
  # by the changes job, so a change to one crate of the tree costs one crate's
  # build rather than the tree's.
  #
  # All three check out the tree and the CI plumbing and nothing else. The
  # tree may depend on nothing outside itself, and this checkout is where that
  # is a fact rather than a convention: with `crates/` and the root manifest
  # absent, a dependency, `#[path]` or `include!` reaching out of the tree has
  # nothing to resolve to and fails the build. The manifest-level rule has a
  # test of its own with a readable failure (build-helpers' sealed_tree).
  #
  # The root .gitignore is in the checkout because it is git plumbing for the
  # path down to the tree, not code: cargo fingerprints a build script by
  # listing its package's files through git, which evaluates the ignore rules
  # of every directory from the repository root down. A sparse checkout is a
  # partial clone, so a .gitignore left out of it has no blob to read and the
  # listing fails ("Failed to update the excludes stack").
  public-libs-shared:
    needs: changes
    if: needs.changes.outputs.public_libs_shared_packages != '' || needs.changes.outputs.public_libs_peppylib_py == 'true'
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      # The workspace checkout, whole: it carries the composite actions below,
      # and it is the checkout every other job of this repository inherits on
      # a reused runner. Nothing of the tree under test is built from here.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tree under test, on its own, in a directory of its own. The
      # partial checkout has to live somewhere this workspace does not: a
      # sparse checkout outlives the job that asked for it (actions/checkout
      # leaves core.sparseCheckout set in the repository's local config, see
      # the repair in rust-build-env), and on a box where one workspace serves
      # every job, sealing this tree off would hand the next job a repository
      # with no `crates/` and no root manifest.
      #
      # The root .gitignore comes too, as git plumbing for the path down to
      # the tree rather than as code: cargo fingerprints a build script by
      # listing its package's files through git, which evaluates the ignore
      # rules of every directory from the repository root down, and a
      # .gitignore with no blob in a partial clone fails that listing
      # ("Failed to update the excludes stack"). `.github/` does not: the
      # actions are used from the workspace checkout above, and leaving it out
      # keeps this checkout to the tree and the one file it needs.
      - uses: actions/checkout@v7
        with:
          path: sealed
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /public-peppy-libs/

      # Puts the box's toolchain on PATH, including the pixi and uv
      # peppylib-py's build script and suite reach for. The workspace is pure
      # Rust plus the peppylib extension: nothing in it builds apptainer or
      # runs a container, so that is the whole environment.
      - uses: ./.github/actions/rust-build-env

      - uses: ./.github/actions/cargo-cache
        with:
          suite: public-libs-shared
          target-dir: sealed/public-peppy-libs/peppy-shared/target

      # peppylib-py is never in the selection: its cdylib build and
      # tests/python_tests.rs only wrap `pixi run test`, which the step below
      # runs directly. The lockfile is workspace-global, so `--locked` still
      # validates it against every member's manifest, peppylib-py included.
      - uses: ./.github/actions/cargo-suite
        if: needs.changes.outputs.public_libs_shared_packages != ''
        with:
          working-directory: sealed/public-peppy-libs/peppy-shared
          command: cargo test --locked ${{ needs.changes.outputs.public_libs_shared_packages }}

      # `pixi run test` builds the native module with `maturin develop` and
      # runs the pytest suite. The install goes first and `--locked`, so a
      # stale pixi.lock fails here instead of being re-resolved by the run.
      # This suite runs whatever the one above did, so one red suite never
      # hides another.
      - name: Run the peppylib-py Python tests
        if: ${{ !cancelled() && needs.changes.outputs.public_libs_peppylib_py == 'true' }}
        working-directory: sealed/public-peppy-libs/peppy-shared/peppylib-py
        run: |
          peppy_home="$RUNNER_TEMP/peppy-home-py"
          mkdir -p "$peppy_home/tmpdir"
          export PEPPY_HOME="$peppy_home" TMPDIR="$peppy_home/tmpdir"
          pixi install --locked
          pixi run test

      # The locked install above must have consumed the committed manifest and
      # lockfile, not rewritten them.
      - name: Prove the peppylib-py suite tested the committed manifest and lockfile
        if: ${{ !cancelled() && needs.changes.outputs.public_libs_peppylib_py == 'true' }}
        working-directory: sealed
        run: git diff --exit-code -- 'public-peppy-libs/*pixi.toml' 'public-peppy-libs/*pixi.lock'

      - name: Clean up the Python suite's peppy data root
        if: always()
        uses: ./.github/actions/reclaim-data-root
        with:
          path: ${{ runner.temp }}/peppy-home-py

  # The standalone crates of the tree: every directory of it outside
  # peppy-shared holding a Cargo.toml, each its own workspace with its own
  # lockfile. They build into one target directory, so a dependency two of
  # them share is compiled once, and the suite's cache directory carries it
  # between runs.
  #
  # openarm_can's bus tests read OPENARM_CAN_TEST_IFACE for a CAN interface to
  # drive and skip themselves when it names none, which is what they do here:
  # the interface would be a virtual CAN link, and the runner kernel carries
  # no vcan module to create one with. What this job holds that crate to is
  # therefore that it compiles and its host-only tests pass; the bus tests are
  # run against a vcan link on a development machine, as their module
  # documentation describes.
  public-libs-crates:
    needs: changes
    if: needs.changes.outputs.public_libs_crates != ''
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/sealed/public-peppy-libs/target

    steps:
      # Two checkouts, as in public-libs-shared: the workspace whole for the
      # actions, and the tree on its own for the build.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          path: sealed
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /public-peppy-libs/

      # These crates are pure Rust: no apptainer, no containers, no Python
      # tooling, so the toolchain alone is the environment they need.
      - uses: ./.github/actions/rust-build-env

      - uses: ./.github/actions/cargo-cache
        with:
          suite: public-libs-crates
          target-dir: sealed/public-peppy-libs/target

      # Every selected crate runs even after one fails, so a red run names
      # every failing crate instead of the first. `--all-features` because a
      # feature of a library crate is an interface a consumer compiles (the
      # openarm nodes take openarm_description's `meshes`), and one no suite
      # builds is one nothing holds to compiling.
      - name: Run every selected crate's suite
        working-directory: sealed/public-peppy-libs
        env:
          # Through the environment rather than an expression expanded into
          # the script: the selection is a list of directory names, and a
          # directory is free to be named anything a filesystem accepts.
          CRATES: ${{ needs.changes.outputs.public_libs_crates }}
        run: |
          set -euo pipefail
          failed=()
          for crate in $CRATES; do
            echo "::group::cargo test: $crate"
            if (cd "$crate" && cargo test --locked --all-features); then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::cargo test failed in $crate"
              failed+=("$crate")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "failing crates: ${failed[*]}" >&2
            exit 1
          fi

      # The locked builds above must have consumed the committed lockfiles,
      # not rewritten them, so the tested dependency graph is the shipped one.
      - name: Prove CI did not rewrite the shipping lockfiles
        if: ${{ !cancelled() }}
        working-directory: sealed
        run: git diff --exit-code -- 'public-peppy-libs/*/Cargo.lock'

  # The standalone Python libraries of the tree: every directory of it holding
  # a pyproject.toml beside a tests/ tree, each running its suite from its own
  # uv environment, resolved --frozen against its committed uv.lock. The
  # suites are self-contained unit tests: no peppy daemon, no container
  # runtime, no hardware, and no cargo, so this job compiles nothing.
  public-libs-python:
    needs: changes
    if: needs.changes.outputs.public_libs_python != ''
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      # Two checkouts, as in public-libs-shared: the workspace whole for the
      # actions, and the tree on its own for the suites.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          path: sealed
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /public-peppy-libs/

      # This job compiles nothing, but the uv these suites run under is on the
      # box rather than on PATH, and this action is what names it.
      - uses: ./.github/actions/rust-build-env

      # The one suite of this workflow that keeps no cache directory of its
      # own and still fills the box: `uv sync` below writes to the user-global
      # ~/.cache/uv, whose built-wheel half never evicts anything. Nothing
      # here rotates it, so what holds it is the floor this leaves free.
      - uses: ./.github/actions/reclaim-cache-disk

      # Every selected library runs even after one fails, so a red run names
      # every failing library instead of the first.
      - name: Run every selected Python library's suite
        working-directory: sealed/public-peppy-libs
        env:
          # Through the environment, as in public-libs-crates.
          LIBRARIES: ${{ needs.changes.outputs.public_libs_python }}
        run: |
          set -euo pipefail
          failed=()
          for lib in $LIBRARIES; do
            echo "::group::pytest: $lib"
            if (cd "$lib" && uv sync --frozen --quiet && uv run --frozen pytest); then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::pytest failed in $lib"
              failed+=("$lib")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "failing libraries: ${failed[*]}" >&2
            exit 1
          fi

      # The frozen installs above must have consumed the committed manifests
      # and lockfiles, not rewritten them.
      - name: Prove the Python suites tested the committed manifests and lockfiles
        if: ${{ !cancelled() }}
        working-directory: sealed
        run: git diff --exit-code -- 'public-peppy-libs/*pyproject.toml' 'public-peppy-libs/*uv.lock'

  # Build scripts execute on the build host even when cargo compiles for
  # another target, so a build script that runs a binary selected by the
  # target triple only fails when host and target differ. The one cross build
  # in the pipeline is the release script's x86_64-unknown-linux-gnu build
  # inside an aarch64 Lima guest, which surfaces such a defect minutes into a
  # release instead of on the pull request that introduced it. This job checks
  # the release dependency tree under the mirrored mismatch (x86_64 host,
  # aarch64 target): `cargo check` runs every build script for real, and one
  # that executes a target-selected binary dies immediately with an exec
  # format error. Apptainer provisioning is skipped because a foreign-arch
  # apptainer needs a Lima VM or a pre-seeded cache and a check build never
  # runs containers.
  cross-check:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-build-env

      # The aarch64 target and the cross gcc come from the box's provisioning,
      # as the rest of what this job builds with does, and this is the one job
      # that needs them. A box without them fails from inside cargo, which
      # reports a dependency that cannot find `core` rather than a runner that
      # was never given the target, so the gap is named here instead. The
      # target list is captured before grep reads it: `grep -q` returns on the
      # first match and would leave rustup writing into a closed pipe.
      - name: Check the host's cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          targets=$(rustup target list --installed 2>/dev/null || true)
          grep -qx aarch64-unknown-linux-gnu <<< "$targets" ||
            missing+=("the aarch64 Rust target")
          command -v aarch64-linux-gnu-gcc > /dev/null ||
            missing+=("aarch64-linux-gnu-gcc")
          if [ ${#missing[@]} -gt 0 ]; then
            list=$(printf '%s, ' "${missing[@]}")
            echo "::error::${RUNNER_NAME:-this host} is missing ${list%, }." \
              "Self-hosted boxes are provisioned with setup_machine.sh --ci-runner:" \
              "https://gist.github.com/godardt/b20a8817e2991eba0bd0d613855627e0"
            exit 1
          fi

      - uses: ./.github/actions/cargo-cache
        with:
          suite: cross-check

      # The linker matters even though `cargo check` itself never links:
      # pmi's build script cargo-installs zenohd for the target, a real
      # release build that links. Without the cross gcc as the target's
      # linker driver, the host cc runs the linker in x86_64 mode, which
      # rejects the aarch64-only flags rustc passes (the release script
      # sets the equivalent variable for its cross direction).
      - name: Cross-check the release dependency tree
        env:
          PEPPY_SKIP_APPTAINER_PROVISION: "1"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo check --locked --target aarch64-unknown-linux-gnu -p peppy

  # The one status check the branch rulesets on dev and main require. It is
  # green only when every job above succeeded or was gated off, so a red
  # suite blocks the merge whichever job it ran in.
  test:
    needs:
      - changes
      - workspace-tests
      - container-e2e
      - multi-daemon-e2e
      - docs-integration
      - release-scripts
      - release-scripts-vm
      - public-libs-shared
      - public-libs-crates
      - public-libs-python
      - cross-check
    # Runs whatever happened above: on the default condition a failed or
    # cancelled suite would leave this check unreported instead of red.
    if: always()
    runs-on: self-hosted
    permissions: {}

    steps:
      - name: Report every job's result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS"

      - name: Fail when any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
