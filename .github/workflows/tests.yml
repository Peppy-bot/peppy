name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  docs-drift:
    runs-on: self-hosted
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check docs are up to date
        id: check
        continue-on-error: true
        run: |
          pixi run --manifest-path scripts is-doc-up-to-date \
            "origin/${{ github.base_ref }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Update docs
        if: steps.check.outcome == 'failure'
        run: |
          pixi run --manifest-path scripts update-docs \
            "origin/${{ github.base_ref }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Open follow-up PR against contributor branch
        if: steps.check.outcome == 'failure'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto/docs-update-${{ github.event.pull_request.number }}
          base: ${{ github.event.pull_request.head.ref }}
          title: "docs: sync with PR #${{ github.event.pull_request.number }}"
          body: |
            Automated doc update generated by `scripts/docs/update_docs.py`
            in response to code changes in #${{ github.event.pull_request.number }}.
          commit-message: "docs: auto-sync with code changes"
          add-paths: docs/**

  test:
    runs-on: self-hosted
    needs: docs-drift
    if: ${{ !cancelled() && (needs.docs-drift.result == 'success' || needs.docs-drift.result == 'skipped') }}
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run tests
        run: cargo test

      - name: Run container e2e tests
        run: cargo test -p core-node --features container_e2e --test container_e2e

      - name: Run documentation integration tests
        run: cargo test -p docs-integration-tests

      - name: Detect scripts/ changes
        id: scripts_changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            scripts:
              - 'scripts/**'

      - name: Run release scripts tests
        if: |
          (github.event_name == 'pull_request' && github.base_ref == 'main')
          || steps.scripts_changed.outputs.scripts == 'true'
        run: ./scripts/run_tests.sh --all
