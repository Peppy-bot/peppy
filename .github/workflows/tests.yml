name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run tests
        run: cargo test

      - name: Run documentation integration tests
        run: cargo test --manifest-path docs/tests/integration/Cargo.toml

      - name: Run release scripts tests
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: ./scripts/run_tests.sh --all
