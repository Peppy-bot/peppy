name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI does the full cross-platform peppylib build: cross-compile the .so for
  # every Linux arch. A plain `cargo build` leaves this unset and, like a Linux
  # build, produces only the host dynamic lib, so local dev builds stay fast; the
  # release path and CI turn it on. On a warm build cache this is a no-op (present,
  # fresh artifacts are reused); it only pays the cross-build cost when the cache
  # is cold. Cross-arch apptainer is separate, gated by PEPPY_CROSS_ARCH.
  PEPPY_CROSS_BUILD: "1"

# Every suite runs in a job of its own, so the workflow finishes with its
# slowest suite rather than the sum of them. Each cargo job builds on a sticky
# disk of its own (the cargo-cache action) holding the target directory, the
# cargo registry and the build scripts' tool cache as the suite's last
# committed run left them, so it compiles only what the change touched. The
# gated suites wait only for the changes job, never for another suite.
jobs:
  # Which of the gated suites have had their inputs touched. The per-suite
  # source sets are derived from cargo metadata's resolve graph at run time
  # (see the action), so added or rewired crates are picked up with nothing
  # to maintain here. A suite whose inputs are untouched has its job skipped,
  # and the action reports the reason in this job's annotations and summary.
  changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      container_e2e: ${{ steps.changes.outputs.container_e2e }}
      docs_integration: ${{ steps.changes.outputs.docs_integration }}
      scripts: ${{ steps.changes.outputs.scripts }}
      public_libs: ${{ steps.changes.outputs.public_libs }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The detection diffs the branch against its base, so both sides of
          # the history must be present.
          fetch-depth: 0
          # Nothing in this workflow pushes, so no job has a use for a writable
          # credential sitting in .git/config for every later step to inherit.
          persist-credentials: false

      # The detection queries cargo metadata, and the action is where the
      # toolchain pin lives.
      - uses: ./.github/actions/rust-build-env

      - name: Detect changed test inputs
        id: changes
        uses: ./.github/actions/changed-test-inputs
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}

  workspace-tests:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Rust toolchain plus the system libraries the container build script
      # compiles apptainer against. Must precede every cargo step.
      - uses: ./.github/actions/rust-build-env

      - uses: ./.github/actions/cargo-cache
        with:
          suite: workspace-tests

      - uses: ./.github/actions/cargo-suite
        with:
          command: cargo test --locked

  container-e2e:
    needs: changes
    if: needs.changes.outputs.container_e2e == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/rust-build-env

      - uses: ./.github/actions/cargo-cache
        with:
          suite: container-e2e

      - uses: ./.github/actions/cargo-suite
        with:
          command: cargo test --locked -p core-node --features container_e2e --test container_e2e

  multi-daemon-e2e:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/rust-build-env

      - uses: ./.github/actions/cargo-cache
        with:
          suite: multi-daemon-e2e

      # A persistent Docker builder: setup-docker-builder starts a buildkitd
      # whose layer cache lives on a sticky disk, hydrated from this job's
      # previous runs and committed back when the job succeeds, and makes it
      # the default builder for every later `docker buildx` command. The
      # multi-daemon e2e builds its daemon image through that client, so its
      # apt and uv layers are built once and reused across runs; the Docker
      # daemon's own embedded builder would rebuild them from scratch on
      # every ephemeral runner. One cache key per build workload, per
      # Blacksmith's scoping guidance.
      - name: Set up the cached Docker builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: peppy/multi-daemon-e2e-image

      - uses: ./.github/actions/cargo-suite
        with:
          command: cargo test --locked -p peppy --features multi_daemon_e2e --test multi_daemon_e2e

  docs-integration:
    needs: changes
    if: needs.changes.outputs.docs_integration == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/rust-build-env

      - uses: ./.github/actions/cargo-cache
        with:
          suite: docs-integration

      # The snippet node tests run cargo offline
      # (snippet_runner::run_cargo_node_tests) and resolve against the registry
      # cache. This suite's own build fetches only the crates it links, and a
      # synced node's dev-dependencies reach further: peppygen's `testing`
      # feature turns on peppylib's, whose crates (ctor among them) only a
      # workspace member's test build pulls in. Fetching the whole lockfile
      # puts every crate the workspace resolves into the cache, which is what
      # a synced node can count on.
      - name: Fetch every crate in the lockfile for the offline snippet builds
        run: cargo fetch --locked

      - uses: ./.github/actions/cargo-suite
        with:
          command: cargo test --locked -p docs-integration-tests

  release-scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Provides the pixi the suite runs under.
      - uses: ./.github/actions/rust-build-env

      - name: Run release scripts tests
        run: |
          # The install tests boot Lima VMs, whose QEMU the runner image
          # lacks (limactl itself comes from the pixi environment). The
          # packages match what the suite's own failure message names. KVM
          # opens when present but group-inaccessible; without it Lima falls
          # back to software emulation, which only costs time.
          sudo apt-get install -y -qq qemu-utils qemu-system
          if [ -e /dev/kvm ] && ! [ -r /dev/kvm -a -w /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          ./scripts/run_tests.sh --all

  # The suites of the sealed public-peppy-libs tree: its peppy-shared workspace,
  # the peppylib Python bindings, and the standalone Python libraries.
  #
  # The tree may depend on nothing outside itself, and this job is where that
  # is a fact rather than a convention: the checkout materializes the tree and
  # the CI plumbing and nothing else. With `crates/` and the root manifest
  # absent, a dependency, `#[path]` or `include!` reaching out of the tree has
  # nothing to resolve to and fails the build. The manifest-level rule has a
  # test of its own with a readable failure (build-helpers' sealed_tree).
  public-libs:
    needs: changes
    if: needs.changes.outputs.public_libs == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      # The root .gitignore is git plumbing for the path down to the tree, not
      # code: cargo fingerprints a build script by listing its package's files
      # through git, which evaluates the ignore rules of every directory from
      # the repository root down. A sparse checkout is a partial clone, so a
      # .gitignore left out of it has no blob to read and the listing fails
      # ("Failed to update the excludes stack").
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /.gitignore
            /public-peppy-libs/

      # Rust toolchain, plus the pixi and uv the Python suites run under.
      - uses: ./.github/actions/rust-build-env

      - uses: ./.github/actions/cargo-cache
        with:
          suite: public-libs
          target-dir: public-peppy-libs/peppy-shared/target

      # peppylib-py is excluded: its cdylib build and tests/python_tests.rs
      # only wrap `pixi run test`, which the step below runs directly. The
      # lockfile is workspace-global, so `--locked` still validates it against
      # peppylib-py's manifest.
      - uses: ./.github/actions/cargo-suite
        with:
          working-directory: public-peppy-libs/peppy-shared
          command: cargo test --workspace --exclude peppylib-py --locked

      # `pixi run test` builds the native module with `maturin develop` and
      # runs the pytest suite. The install goes first and `--locked`, so a
      # stale pixi.lock fails here instead of being re-resolved by the run.
      # The later suites run whatever the earlier ones did, so one red suite
      # never hides another.
      - name: Run the peppylib-py Python tests
        if: ${{ !cancelled() }}
        working-directory: public-peppy-libs/peppy-shared/peppylib-py
        run: |
          peppy_home="$RUNNER_TEMP/peppy-home-py"
          mkdir -p "$peppy_home/tmpdir"
          export PEPPY_HOME="$peppy_home" TMPDIR="$peppy_home/tmpdir"
          pixi install --locked
          pixi run test

      # Every directory holding a pyproject.toml and a tests/ tree is
      # discovered from the filesystem and runs its suite from its own uv
      # environment, resolved --frozen against its committed uv.lock. The
      # suites are self-contained unit tests: no peppy daemon, no container
      # runtime, no hardware. Every discovered library runs even after one
      # fails, so a red run names every failing library instead of the first.
      - name: Run every standalone Python library's suite
        if: ${{ !cancelled() }}
        working-directory: public-peppy-libs
        run: |
          set -euo pipefail
          failed=()
          for manifest in */pyproject.toml; do
            lib=$(dirname "$manifest")
            [ -d "$lib/tests" ] || continue
            echo "::group::pytest: $lib"
            if (cd "$lib" && uv sync --frozen --quiet && uv run --frozen pytest); then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::pytest failed in $lib"
              failed+=("$lib")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "failing libraries: ${failed[*]}" >&2
            exit 1
          fi

      # The frozen and locked installs above must have consumed the committed
      # manifests and lockfiles, not rewritten them.
      - name: Prove the Python suites tested the committed manifests and lockfiles
        if: ${{ !cancelled() }}
        run: git diff --exit-code -- 'public-peppy-libs/*pyproject.toml' 'public-peppy-libs/*uv.lock' 'public-peppy-libs/*pixi.toml' 'public-peppy-libs/*pixi.lock'

      - name: Clean up the Python suite's peppy data root
        if: always()
        run: rm -rf "$RUNNER_TEMP/peppy-home-py"

  # Build scripts execute on the build host even when cargo compiles for
  # another target, so a build script that runs a binary selected by the
  # target triple only fails when host and target differ. The one cross build
  # in the pipeline is the release script's x86_64-unknown-linux-gnu build
  # inside an aarch64 Lima guest, which surfaces such a defect minutes into a
  # release instead of on the pull request that introduced it. This job checks
  # the release dependency tree under the mirrored mismatch (x86_64 host,
  # aarch64 target): `cargo check` runs every build script for real, and one
  # that executes a target-selected binary dies immediately with an exec
  # format error. Apptainer provisioning is skipped because a foreign-arch
  # apptainer needs a Lima VM or a pre-seeded cache and a check build never
  # runs containers.
  cross-check:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-build-env

      - uses: ./.github/actions/cargo-cache
        with:
          suite: cross-check

      - name: Install the aarch64 cross toolchain
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      # The linker matters even though `cargo check` itself never links:
      # pmi's build script cargo-installs zenohd for the target, a real
      # release build that links. Without the cross gcc as the target's
      # linker driver, the host cc runs the linker in x86_64 mode, which
      # rejects the aarch64-only flags rustc passes (the release script
      # sets the equivalent variable for its cross direction).
      - name: Cross-check the release dependency tree
        env:
          PEPPY_SKIP_APPTAINER_PROVISION: "1"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo check --locked --target aarch64-unknown-linux-gnu -p peppy

  # The one status check the branch rulesets on dev and main require. It is
  # green only when every job above succeeded or was gated off, so a red
  # suite blocks the merge whichever job it ran in.
  test:
    needs:
      - changes
      - workspace-tests
      - container-e2e
      - multi-daemon-e2e
      - docs-integration
      - release-scripts
      - public-libs
      - cross-check
    # Runs whatever happened above: on the default condition a failed or
    # cancelled suite would leave this check unreported instead of red.
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions: {}

    steps:
      - name: Report every job's result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS"

      - name: Fail when any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
