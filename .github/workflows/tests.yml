name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    runs-on: ubuntu-latest
    container: rust:latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install clippy
      run: rustup component add clippy

    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    container: rust:latest

    steps:
    - uses: actions/checkout@v4

    - name: Run tests
      run: cargo test --verbose