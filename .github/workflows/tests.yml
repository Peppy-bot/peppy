name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run tests
        run: cargo test

      - name: Run container e2e tests
        run: cargo test -p core-node --features container_e2e --test container_e2e

      - name: Run documentation integration tests
        run: cargo test -p docs-integration-tests

      - name: Run release scripts tests
        if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'release'))
        run: ./scripts/run_tests.sh --all
