name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v6

      - name: Run tests
        run: cargo test

      - name: Run documentation integration tests
        run: cargo test --manifest-path docs/tests/integration/Cargo.toml
