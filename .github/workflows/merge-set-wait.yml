name: Merge set wait

# A person has 12 hours to review a set of developers before its authors can
# ask for the Claude review; an admin can ask for it at any time (see
# .github/merge-set/merge_set.py). No event of GitHub comes when that time
# passes, so this workflow starts the sync (merge-set.yml) of each set that
# waits for a person, and of each set whose merge-set comment still counts
# down a wait that is over: the sync shows the time left in the merge-set
# comment, and when the time ends, tells the authors that the box of the
# Claude review is theirs to tick.
#
# The webhook function of the merge-set App (.github/merge-set/webhook.py)
# starts this workflow from `dev` every WAIT_SYNC_INTERVAL of merge_set.py, at
# the event of a schedule of aws/peppy-ci-pipelines in Peppy-bot/infraops. A
# schedule of GitHub Actions starts its runs late, or drops them, when the
# runners of GitHub are busy. The key of the merge-set App is a secret of the
# `merge-set` environment, which only runs from `dev` reach.
on:
  workflow_dispatch:

# One run at a time. A run that waits is cancelled by the next one: each run
# reads every set again.
concurrency:
  group: merge-set-wait
  cancel-in-progress: false

jobs:
  start-syncs:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment:
      name: merge-set
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Name the repositories of a set
        id: repositories
        run: python3 .github/merge-set/merge_set.py repositories

      # Reads the open pull requests of each set, their reviews and the
      # permissions of their reviewers, who is in the team that gets the offer
      # of the review, and the merge-set comments.
      - name: Make the reading token
        id: read-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.MERGE_SET_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_SET_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repositories.outputs.repositories }}
          permission-members: read
          permission-pull-requests: read

      # Starts the Merge set workflow of peppy, and does nothing else.
      - name: Make the dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.MERGE_SET_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_SET_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: peppy
          permission-actions: write

      - name: Start the sync of each set whose merge-set comment changes with the time
        env:
          MERGE_SET_TOKEN: ${{ steps.read-token.outputs.token }}
          MERGE_SET_DISPATCH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          MERGE_SET_BOT_LOGIN: ${{ steps.read-token.outputs.app-slug }}[bot]
        run: python3 .github/merge-set/merge_set.py wait-syncs
