name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: [self-hosted, llm]
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  simplify:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, llm]
    concurrency:
      group: claude-simplify-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Run Claude Simplify
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash(git *),Bash(gh pr *),Bash(cargo fmt *),Bash(cargo clippy *)"'
          prompt: |
            Run /simplify on the changes in this PR (#${{ github.event.pull_request.number }}).

            IMPORTANT: Do NOT push changes to the original PR branch "${{ github.event.pull_request.head.ref }}".

            If improvements are found:
            1. Create a new branch named "claude/simplify-pr-${{ github.event.pull_request.number }}" from HEAD
            2. Commit all improvements to that branch
            3. Push and open a new PR from that branch targeting "${{ github.event.pull_request.head.ref }}"
               with the title "refactor: simplify PR #${{ github.event.pull_request.number }}"
            4. If a branch "claude/simplify-pr-${{ github.event.pull_request.number }}" already exists,
               force-push to update it and update the existing PR

            If no improvements are needed, do nothing.
