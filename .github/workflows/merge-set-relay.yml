name: Merge set relay

# The part of the merge-set bot that runs in each repository of a set. The
# workflow merge-set-events.yml of peppy and of each hub calls it on every
# event that can change a set, and it starts the Merge set workflow of peppy
# (merge-set.yml) for the branch of the event, which reads and writes the set
# (see .github/merge-set/merge_set.py).
#
# Every event that calls it runs the workflow of the default branch of the
# repository, never the copy of a pull request: pull_request_target,
# issue_comment, workflow_run and delete. The key of the merge-set App is a
# secret of the `merge-set` environment of each repository, which only the
# default branch reaches, and which this job reads because the caller hands
# its secrets on (`secrets: inherit`). The first token this job makes can
# start workflows of peppy and do nothing else. The second one, made for a
# comment edit alone, can write the pull requests of the repository of the
# event and do nothing else: with it, the relay answers a ticked box on its
# pull request.
on:
  workflow_call:

jobs:
  relay:
    # The events that can change a set: a pull request into the default
    # branch opened, pushed, reopened, closed, made a draft or ready for
    # review, or moved onto the default branch; a box of a merge-set comment
    # ticked by a user (the edits of the bot start nothing); a CI run of a
    # pull request that ended; a deleted branch. A pull_request_target event
    # runs from the base branch of its pull request, and only the default
    # branch reaches the `merge-set` environment, which is also the one
    # branch the rulesets require the `merge-set` check on.
    if: >-
      (github.event_name == 'pull_request_target'
        && github.event.pull_request.base.ref == github.event.repository.default_branch
        && (github.event.action != 'edited' || github.event.changes.base != null))
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && github.event.comment.user.type == 'Bot'
        && github.event.sender.type != 'Bot'
        && startsWith(github.event.comment.body, '<!-- peppy-merge-set -->'))
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request')
      || (github.event_name == 'delete' && github.event.ref_type == 'branch')
    # A GitHub-hosted 1-vCPU runner, not a RunsOn one: it starts in a few
    # seconds, where a RunsOn instance boots in about 40, and a user who
    # ticks a box waits for this job to answer. The job reads the event and
    # makes a few API calls.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    environment:
      name: merge-set
      deployment: false
    permissions:
      contents: read
      # A comment names its pull request alone: the relay reads the branch
      # of the pull request with the job token.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Peppy-bot/peppy
          ref: dev
          sparse-checkout: .github
          persist-credentials: false

      - name: Make the token that starts the Merge set workflow
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.MERGE_SET_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_SET_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: peppy
          permission-actions: write

      - name: Make the token that answers a ticked box
        id: comment-token
        if: github.event_name == 'issue_comment'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.MERGE_SET_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_SET_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      - name: Start the Merge set workflow of peppy, and answer a ticked box
        env:
          MERGE_SET_TOKEN: ${{ steps.token.outputs.token }}
          COMMENT_TOKEN: ${{ steps.comment-token.outputs.token }}
          PULL_REQUEST_READ_TOKEN: ${{ github.token }}
        run: python3 .github/merge-set/merge_set.py relay
