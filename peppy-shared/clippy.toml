# The names that a doc comment writes as plain words: products, formats and
# platforms, not items of the code. `..` keeps the names that clippy knows.
doc-valid-idents = [
    "..",
    "AppArmor",
    "AsyncAPI",
    "BuildKit",
    "CPython",
    "OpenArm",
    "OrbStack",
    "PascalCase",
    "PyO3",
    "PyPI",
    "QoS",
    "SIGKILLed",
    "WebPKI",
    "x86_64",
]
