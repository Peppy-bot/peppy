[package]
name = "peppy-config-model"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` keeps `serde_json::Map` backed by `IndexMap` so that
# parsing a `NodeConfig` preserves `MessageFormat` field order; the capnp
# wire layout (rendered by the `peppy-codec` crate) is keyed off that order,
# so losing it breaks producer/consumer schema compat.
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_json5 = "0.2"
serde_path_to_error = "0.1"
tracing = "0.1"
walkdir = "2.5"
# Used only by the `Capnp` error variant in `error.rs`; the Cap'n Proto
# schema of a message format is rendered by the `peppy-codec` crate.
capnp = "0.27"
sha2 = "0.11"
indexmap = { version = "2.2", features = ["serde"] }
# Validates the workspace namespace as a zenoh non-wild key expression so an
# invalid workspace id can never reach a live session. Pinned to
# the zenoh version pmi/zenohd federate against.
zenoh-keyexpr = "=1.10.2"
# `atomic_write::publish_atomic` stages through `NamedTempFile` siblings.
# Optional, so that the lockfile of a node that vendors this crate has no
# entry for it.
tempfile = { version = "3.8", optional = true }

[dev-dependencies]
# Scratch dirs/files for the fingerprint, runtime, and parser tests.
tempfile = "3.8"
# The tests of `atomic_write` run in every test build of the crate.
peppy-config-model = { path = ".", features = ["atomic_write"] }

[features]
default = []
# Gives the `atomic_write` module, which needs `tempfile`. The daemon crates
# and the codec API turn it on; a generated node does not.
atomic_write = ["dep:tempfile"]
# Gates the fingerprint test helpers (`create_codegen_fingerprint`,
# `create_wrong_codegen_fingerprint`), which are co-located with the production
# fingerprint reader because they share its private file-layout constants. The
# git-repo/template fixtures that used to live behind this flag (and pulled in
# git2) now live in the separate `config-test-support` crate.
fingerprint_test_helpers = []
