# A simple node that emits video frames from a UVC camera
node_config:
  name: "uvc_camera"
  namespace: "/"
  version: "0.1.0"
  auto_start: false # Can be started with the `/camera/enable` service
  tags:
    - "uvc"
    - "camera"
    - "usb"
  respawn: true
  respawn_delay: 5.0
  # When pull is set to `true`, `peppy` will attempt to pull the node from nodes.peppy.bot
  # based on the node_config.name and node_config.version
  # Any configuration that is defined within that configuration file will overwrite the one defined in the remote node
  pull: true

# Parameters before the node starts
node_parameters:
  video:
    device_path: "/dev/video5"
    frame_rate: 30
    resolution:
      width: 1920
      height: 1080
    encoding: "YUYV" # "rgb8", "bgr8", "yuyv", "mjpeg"

exposes:
  topics:
    - name: "/camera/video_feed"
      type: "sensor_message/image"
      qos_profile: "sensor_data"
      message_format:
        header:
          stamp: "time"
        encoding: str # "rgb8", "bgr8", "yuyv", "mjpeg"
        width: uint32
        height: uint32
        image:
          - uint8
          - uint8
          - uint8
  services:
    - type: "standard/set_bool"
      name: "/camera/enable"
      callback: "handle_camera_enable"

subscribes_to: []

resources:
  max_memory_mb: 256

logging:
  min_level: "info"

diagnostics:
  enabled: true
  publish_rate_hz: 1.0
  health_checks:
    - "camera_connected"
    - "frame_rate_nominal"
    - "buffer_underrun"
