# Connects to root nodes and aggregate their content in a web interface
node_config:
  name: "peppy_web"
  namespace: "/"
  version: "0.1.0"
  tags:
    - "peppy"
    - "rest"
    - "backend"
  auto_start: true
  respawn: true
  respawn_delay: 2.0

node_parameters:
  http:
    host: "0.0.0.0"
    port: 8080
    max_connections: 100
    request_timeout_ms: 3000

# This node does not expose anything for other nodes. It exposes a REST API to the end user but that is outside of the realm of node-to-node communication
exposes:
  topics: []
  services: []
  actions: []

subscribes_to:
  topics:
    # Subscribes to the current root_node status but also any node that emits to `/<dev:prod>/root_node/status`
    - name: "{any}" # `{any}` means any node that emits on `/<dev:prod>/root_node/status`.
      version: "0.1.0" # Only on that particular version
      type: "/peppy/status" # The type of messages we're interested in
      namespace: "/" # In what ns is this node deployed?
      callback: "on_node_status_received" # The code callback that will automatically be exposed in the Rust/Python code via auto code generation
      optional: true # Do not prevent this node from starting if nodes emitting to `/root_node/status` are not found on the network
  service:
    - name: "{any}"
      version: "0.1.0" # Only on that particular version
      type: "/peppy/node"
      callback: "on_node_payload_received"
      optional: true # Do not prevent this node from starting if nodes emitting to `/root_node/status` are not found on the network

resources:
  max_memory_mb: 512

logging:
  min_level: "info"
