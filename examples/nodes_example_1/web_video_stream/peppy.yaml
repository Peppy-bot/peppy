# PeppyOS REST API Service Node Configuration
# This node provides a REST API interface for system interaction

node_config:
  name: "web_video_stream"
  namespace: "/"
  version: "0.1.0"
  respawn: true
  respawn_delay: 10.0

# The parameters of the current node
node_parameters:
  http:
    host: "localhost"
    port: 8081
    cors_enabled: true
    cors_origins: "*"
    max_connections: 100
    request_timeout_ms: 30000
  video_stream:
    format: "mjpeg"
    quality: 80
    max_fps: 30

subscribes_to:
  topics:
    - node: "uvc_camera:0.1.0" # Will pull this particular version if specified, otherwise pulls the most recent one (always specify it to avoid breaking changes if pulled from nodes.peppy.bot)
      namespace: "/" # In what ns is this node deployed? (Or will be deployed to if not present)
      name: "/camera/video_feed" # The name of the topic of the `uvc_camera` node we're interested in
      callback: "on_handle_video_feed" # The code callback that will automatically be exposed in the Rust/Python code via auto code generation

# This node does not expose anything for other nodes. It exposes a web url (http://localhost:8081/video) to the end user but that is outside of the realm of node-to-node communication
exposes: []

resources:
  max_memory_mb: 512
  cpu_affinity: []
  max_threads: 10

logging:
  min_level: "info"
  file_path: "/var/log/peppy/rest_api.log"
  max_file_size_mb: 100
  format: "text"

diagnostics:
  enabled: true
  publish_rate_hz: 0.5
  health_checks:
    - "http_server_running"
    - "websocket_connections"
    - "request_latency"
    - "error_rate"
