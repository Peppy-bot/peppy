# Rest API that connects to the root peppy node or multiple root nodes and expose their status via a REST API
node_config:
  name: "peppy_rest_api"
  namespace: "/"
  version: "0.1.0"
  tags:
    - "peppy"
    - "rest"
    - "backend"
  respawn: true
  respawn_delay: 2.0

node_parameters:
  http:
    host: "0.0.0.0"
    port: 8080
    cors_enabled: true
    cors_origins: "*"
    max_connections: 100
    request_timeout_ms: 30000

# This node does not expose anything for other nodes. It exposes a REST API to the end user but that is outside of the realm of node-to-node communication
exposes:
  topics: []
  services: []
  actions: []

subscribes_to:
  topics:
    # Subscribes to the current root_node status but also any node that emits to `/root_node/status`
    - node: "{any}:0.1.0" # `{any}:0.1.0` means any node that emits on `/root_node/status` with a version of `0.1.0`.
      # `{any}:{any}` can also be used to list to any node on any version on `/root_node/status`
      name: "/root_node/status" # The name of the topic of the `{any}:0.1.0` nodes we're interested in
      namespace: "/" # In what ns is this node deployed? (Or will be deployed to if not present)
      callback: "on_node_status_received" # The code callback that will automatically be exposed in the Rust/Python code via auto code generation
      optional: true # Do not prevent this node from starting if nodes emitting to `/root_node/status` are not found on the network

resources:
  max_memory_mb: 512

logging:
  min_level: "info"
