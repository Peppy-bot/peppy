[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hello_receiver"
version = "0.1.0"
description = "hello_receiver peppy node"
requires-python = ">=3.11,<3.14"
dependencies = ["peppygen", "peppylib"]

[project.scripts]
hello_receiver = "hello_receiver.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_receiver"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
