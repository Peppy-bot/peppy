[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optional_receiver"
version = "0.1.0"
description = "optional_receiver peppy node"
requires-python = ">=3.11,<3.14"
dependencies = ["peppygen", "peppylib"]

[project.scripts]
optional_receiver = "optional_receiver.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/optional_receiver"]

[dependency-groups]
dev = []

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
