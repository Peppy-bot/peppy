[package]
name = "docs-integration-tests"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
peppy = { path = "../../../crates/peppy", features = ["test-support"] }
config = { workspace = true }
daemon-config = { workspace = true }
# `snippet_runner::run_node_tests` forwards the zenohd binary this test
# toolchain resolved (via `PEPPY_ZENOHD_PATH`) to the node-author test suites
# it spawns: the snippet's vendored pmi is built without `build_zenoh`, so
# inside the test environment (no `peppy` on PATH) it has nothing else to
# resolve. Lives in [dependencies] because the helper is in the lib target.
pmi = { workspace = true, features = ["zenoh", "build_zenoh"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
# Used by tests/snippet_configs.rs to walk the docs snippets and peek each
# file's `peppy_schema` tag before dispatching to the matching `config` parser.
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json5 = "0.2"

[[test]]
name = "rust_snippets"
path = "tests/rust_snippets.rs"

[[test]]
name = "python_snippets"
path = "tests/python_snippets.rs"

[[test]]
name = "snippet_configs"
path = "tests/snippet_configs.rs"
