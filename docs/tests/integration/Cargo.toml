[package]
name = "docs-integration-tests"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
peppy = { path = "../../../crates/peppy", features = ["test-support"] }
config = { path = "../../../crates/config-internal" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = "0.3"

[[test]]
name = "rust_snippets"
path = "tests/rust_snippets.rs"

[[test]]
name = "python_snippets"
path = "tests/python_snippets.rs"
