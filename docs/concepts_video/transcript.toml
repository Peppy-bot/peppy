[[segment.voice]]
id = "exposure"
text = "An exposure is a document that lists what an MCP client can reach."

[[segment.voice]]
id = "publishes"
text = "It publishes the topics that you select as resources, and the services and the actions as tools."

[[segment.voice]]
id = "task"
text = "A long action can run as a task, with its progress."

[[segment.voice]]
id = "schemas"
text = "Peppy derives each schema from the contracts, so you write none."

[[segment.voice]]
id = "only_named"
text = "An MCP client reaches only what the exposure names."

[[segment.voice]]
id = "open_some"
text = "Thus you open the functions that are not critical to an LLM, and the other functions stay closed."

[segment.screen]
client = "LLM application"
server = "MCP server of Peppy"
exposure = "exposure"
