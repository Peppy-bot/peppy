[[segment.voice]]
id = "launcher"
text = "A launcher is one file that describes a full stack: its nodes, their instances, their parameters, and the links between them."

[[segment.voice]]
id = "one_command"
text = "One command starts it."

[[segment.voice]]
id = "in_order"
text = "Peppy adds, builds, and starts each node in the order of the dependencies."

[[segment.voice]]
id = "by_name"
text = "Peppy finds nodes, launchers, and contracts by name in repositories."

[[segment.voice]]
id = "nothing_to_clone"
text = "Thus you have no repository to clone and no workspace to build."

[[segment.voice]]
id = "two_steps"
text = "The first run of a robot stack is two steps: install Peppy, then launch."

[[segment.voice]]
id = "seven_steps"
text = "In ROS 2, the same first run is seven steps with four tools."

[[segment.voice]]
id = "one_tool"
text = "In Peppy, one command line does all of this."
pause_after_seconds = 2.0

