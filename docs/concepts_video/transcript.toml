[[segment.voice]]
id = "is_a_node"
text = "In Peppy, each of these programs is a node."

[[segment.voice]]
id = "one_function"
text = "A node has one function, and you write it in Rust or in Python."

[[segment.voice]]
id = "one_file"
text = "One file, `peppy.json5`, declares the node."

[[segment.voice]]
id = "file_parts"
text = "The file gives its name, its interfaces, its parameters, and the commands that build it and run it."

[[segment.voice]]
id = "three_types"
text = "A node has three types of interface."

[[segment.voice]]
id = "topic"
text = "A topic is a stream of messages."

[[segment.voice]]
id = "topic_how"
text = "One node publishes the messages, and each node that subscribes receives them."

[[segment.voice]]
id = "service"
text = "A service answers a request."

[[segment.voice]]
id = "service_how"
text = "One node asks, and the other node replies."

[[segment.voice]]
id = "action"
text = "An action runs a long task."

[[segment.voice]]
id = "action_how"
text = "It gives feedback during the task, and the task can stop before its end."

[[segment.voice]]
id = "sync"
text = "The command `peppy node sync` reads the file and generates typed code for each interface."

[[segment.voice]]
id = "agree"
text = "Thus your code and the file always agree."

[[segment.voice]]
id = "new_message"
text = "A new message is one entry in the file and one more sync."
pause_after_seconds = 5.0

