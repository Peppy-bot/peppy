[segment.screen.standalone.code]
language = "python"
code = '''
with open("params.json") as f:
    params = json.load(f)

standalone_config = StandaloneConfig().with_parameters(params)
NodeBuilder().standalone(standalone_config).run(setup)
'''

[segment.screen.test]
label = "One test, with no daemon and no camera node: a generated mock is the camera."

[segment.screen.test.code]
language = "python"
example_names = ["test_node_reads_a_frame", "camera", "video_stream", "width", "frame", "outcome"]
code = '''
async def test_node_reads_a_frame():
    async with harness.start(setup) as h:
        await h.mocks.deps.camera.video_stream.publish(
            video_stream.Message(width=640, frame=b"\x01\x02")
        )
        status = await h.emitted.status.next()
        assert status.outcome == "done"
'''

