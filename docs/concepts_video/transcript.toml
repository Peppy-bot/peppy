text = "In Peppy, each machine that runs the daemon is a core node, with a name of its own."

[[segment.voice]]
id = "links"
text = "A launcher names no machine: it declares core node links, and each instance names the link that it runs on."

[[segment.voice]]
id = "sign_in"
