[[segment.voice]]
id = "problem"
text = "The models of robot brains change quickly."

[[segment.voice]]
id = "problem_cost"
text = "If the other nodes depend on one specific brain, each new brain changes these nodes."

[[segment.voice]]
id = "contract"
text = "For this, a contract is a document that declares one job as topics, services, and actions."

[[segment.voice]]
id = "brains_job"
text = "For example, the job of a robot brain: it takes the pictures of the cameras, and it gives motions."

[[segment.voice]]
id = "implements"
text = "A node that does the job declares that it implements the contract."

[[segment.voice]]
id = "depends"
