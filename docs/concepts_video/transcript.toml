[[segment.voice]]
id = "same_job"
text = "Many nodes can do the same job."

[[segment.voice]]
id = "brains_job"
text = "For example, each robot brain takes the pictures of the cameras and gives motions."

[[segment.voice]]
id = "contract"
text = "A contract is a document that declares this job as topics, services, and actions."

[[segment.voice]]
id = "implements"
text = "A node that does the job declares that it implements the contract."

[[segment.voice]]
id = "depends"
text = "A node that needs the job depends on the contract, and not on a specific node."

[[segment.voice]]
id = "binds"
text = "At launch time, the launcher connects it to a node that implements the contract."

[[segment.voice]]
id = "models_change"
text = "This is important for robot brains, because their models change quickly."

[[segment.voice]]
id = "same_contract"
text = "A VLA, a WAM, and a brain that uses a VLM can all implement the same contract."

[[segment.voice]]
id = "same_io"
text = "Each one takes the same inputs and gives the same outputs."

[[segment.voice]]
id = "replace"
text = "Thus you replace one brain with another, and the other nodes do not change."

