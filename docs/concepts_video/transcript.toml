[[segment.voice]]
id = "act"
text = "Part two: the stack."
pause_after_seconds = 1.0

[[segment.voice]]
id = "problem"
text = "A robot has many nodes: something must start them in the correct order, and keep them in operation."

[[segment.voice]]
id = "daemon"
text = "In Peppy, this is the daemon: a program that runs on each machine."

[[segment.voice]]
id = "daemon_work"
text = "The daemon builds each node, starts its instances, and monitors their health."

[[segment.voice]]
id = "instance"
text = "An instance is one node in operation, and one node can have many."

[[segment.voice]]
id = "restart"
text = "If an instance fails, the daemon starts it again."

[[segment.voice]]
id = "one_graph"
text = "The daemon keeps all the nodes and their dependencies in one graph: the node stack."

[[segment.voice]]
id = "no_cycle"
text = "The graph has no cycle, so each node starts after the nodes that it depends on."

[[segment.voice]]
id = "check"
text = "When you add a node, the stack makes sure that each dependency exposes the interfaces that the node uses."

[[segment.voice]]
id = "early"
text = "Thus a wrong connection shows when you add the node, and not during operation."

[[segment.voice]]
id = "list"
text = "And one command, `peppy stack list`, shows the full graph, to a developer or to a program."
pause_after_seconds = 2.0

[segment.screen]
problem = "Many nodes must start in the correct order, and stay in operation."
benefit = "The stack starts in order, and a wrong connection shows before the start."
