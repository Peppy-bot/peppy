pause_after_seconds = 1.0

[[segment.voice]]
id = "problem"
text = "One large program for a full robot is hard to write, to test, and to change."

[[segment.voice]]
id = "is_a_node"
text = "In Peppy, a robot is many small programs, and each one is a node."

[[segment.voice]]
id = "one_function"
text = "A node has one function, and you write it in Rust or in Python."

[[segment.voice]]
id = "must_exchange"
text = "But the nodes must exchange data, in three different ways."

[[segment.voice]]
id = "topic_why"
text = "A camera gives pictures all the time."

[[segment.voice]]
id = "topic"
text = "For this, a topic is a stream of messages: one node publishes them, and each node that subscribes receives them."

[[segment.voice]]
id = "service_why"
text = "Sometimes, a node has one question for another node."

[[segment.voice]]
id = "service"
text = "For this, a service answers a request: one node asks, and the other node replies."

[[segment.voice]]
id = "action_why"
text = "And some tasks are long, such as a motion of the arm."

[[segment.voice]]
id = "action"
text = "For this, an action runs a long task: it gives feedback during the task, and the task can stop before its end."

[[segment.voice]]
id = "benefit"
text = "Thus each node says exactly what it gives and what it needs."
pause_after_seconds = 2.0

