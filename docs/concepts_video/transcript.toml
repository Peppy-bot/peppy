  "Install ROS 2.",
  "`source /opt/ros/<distro>/setup.bash`",
  "`mkdir -p ~/ros2_ws/src`, then `git clone <repository>` in it",
  "`rosdep install -i --from-path src --rosdistro <distro> -y`",
  "`colcon build`",
  "`source install/local_setup.bash`, in a new terminal",
  "`ros2 launch <package> <launch file>`",
]
