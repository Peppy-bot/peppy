[segment.screen.cards.launcher]
term = "Launcher"
definition = "One file that describes a full stack: the nodes, their instances, their parameters and their links."
equivalent = "The one file that starts all the services of a web application."

[segment.screen.cards.repository]
term = "Repository"
definition = "The place where Peppy finds nodes, launchers and contracts by name."
equivalent = "A package registry."

[segment.screen.comparisons.first_run]
