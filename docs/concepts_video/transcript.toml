# The transcript of the concepts video.
#
# This file is the only source of the voice, of the captions and of each text
# that the video shows. A text between two backticks is a technical name: a
# command, a flag, a file name or a name of an API.
#
# Each segment names the sections of `docs/src/content/docs` that it rests on,
# with the SHA-256 of the text of each section. When a test says that a
# section changed, read the segment against the section, correct the segment if
# necessary, then set the hash that the test gives.

[voice]
id = "af_heart"
speed = 0.9
language = "en-us"
# The silence, in seconds, before the first sentence of a segment, between two
# sentences, and after the last sentence of a segment.
lead_in_seconds = 0.8
sentence_gap_seconds = 0.6
tail_seconds = 1.0

# How the voice says a written word that it reads wrongly.
[pronunciation]
"peppy.json5" = "peppy dot jason five"
"ROS 2" = "ross two"
"uv" = "you vee"
"VLA" = "V L A"

# The words of the frames of the cards, of the scenes and of the map.
[labels]
term = "Term"
equivalent = "In general software"
comparison = "Compared with ROS 2"
ros2 = "ROS 2"
peppy = "Peppy"
act = "Part"
problem = "The problem"
benefit = "What you get"
in_ros2 = "In ROS 2"

# The splash screen, which shows before the first segment, with the music and
# with no voice.
[splash]
seconds = 4.0

[splash.screen]
name = "Peppy"
title = "The concepts"

# The acts of the video. An act is a group of segments that answer one
# question, and the screen shows it as a part of the video. A segment names
# its act. The first and the last segment are in no act.
[[act]]
id = "one_node"
title = "One node"
question = "How do you write one program of the robot?"

[[act]]
id = "stack"
title = "The stack"
question = "How do the programs run together?"

[[act]]
id = "real_world"
title = "The real world"
question = "How does the stack go to a real robot?"

