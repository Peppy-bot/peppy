[[segment.voice]]
id = "place"
text = "Then, in the launch command, you give each link the name of a core node."

[[segment.voice]]
id = "brains"
text = "The large brain then runs in the cloud, and the small brain runs on the robot: system 2 and system 1, in one stack."

[[segment.voice]]
id = "across"
text = "The links between nodes work across machines."

[[segment.voice]]
id = "local"
text = "And one flag runs the same launcher on one workstation."
