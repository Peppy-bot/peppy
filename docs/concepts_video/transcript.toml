[[segment.voice]]
id = "several"
text = "One stack can run on several machines."

[[segment.voice]]
id = "core_node"
text = "Each machine that runs Peppy is a core node: the board of a robot, a workstation, or a machine in the cloud."

[[segment.voice]]
id = "name"
text = "Each core node has a name of its own."

[[segment.voice]]
id = "links"
text = "A launcher names no machine: it declares core node links, which are placeholders for core nodes."

[[segment.voice]]
id = "instance_link"
text = "Each instance names the link that it runs on."

[[segment.voice]]
id = "sign_in"
text = "On each machine, you install Peppy and sign in one time."

[[segment.voice]]
id = "place"
text = "Then, in the launch command, you give each link the name of a core node."

[[segment.voice]]
id = "large_brain"
text = "For example, a large robot brain runs on a GPU machine in the cloud."

[[segment.voice]]
id = "small_brain"
text = "A small, fast brain runs on the board of the robot."

[[segment.voice]]
id = "systems"
text = "These are system 2 and system 1 of the robot, in one stack."

[[segment.voice]]
id = "across"
text = "The links between nodes work across machines, and each node starts after the nodes that it depends on."

[[segment.voice]]
id = "local"
text = "One flag runs the same launcher on one workstation."

[segment.screen]
login_command = "`peppy platform login`"
place_command = "`peppy stack launch --place <link>@<core node> <launcher>`"
local_command = "`peppy stack launch --local <launcher>`"
tools_note = "Each machine builds its nodes with its own tools, such as `uv`."
workstation = "workstation"

[segment.screen.robot]
machine = "board of the robot"
name = "robot-1"
link = "onboard"
brain = "small brain"
system = "system 1"

[segment.screen.cloud]
machine = "GPU machine in the cloud"
name = "gpu-1"
link = "cloud"
brain = "large brain"
system = "system 2"

[segment.screen.cards.core_node]
term = "Core node"
definition = "One machine that runs Peppy. Its daemon is the root of the node stack of the machine."
equivalent = "One host of a cluster."

[segment.screen.cards.core_node_link]
term = "Core node link"
definition = "A placeholder for a core node in a launcher."
equivalent = "A variable for the host of a deployment."

[segment.screen.cards.system_2]
term = "System 2"
definition = "The slow part of a robot brain: it reasons and plans, approximately one time each second."

[segment.screen.cards.system_1]
term = "System 1"
definition = "The fast part of a robot brain: it reacts and controls the motion, many times each second."

[segment.screen.comparisons.machines]
ros2 = "The ROS 2 documentation describes no command that starts one launch file on several machines. You start the nodes on each machine."
peppy = "One launch command starts the instances on each machine of the stack."

