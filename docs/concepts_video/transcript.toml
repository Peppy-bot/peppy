as = "resource"

[segment.screen.published.service]
from = "service"
as = "tool"

[segment.screen.published.action]
from = "action"
as = "tool that can run as a task"

[segment.screen.cards.mcp]
term = "MCP"
definition = "Model Context Protocol: a standard protocol that gives an LLM application data to read and tools to call."
equivalent = "An API for LLM applications."

[segment.screen.cards.exposure]
term = "Exposure"
definition = "A document that lists the topics, the services and the actions that an MCP client can reach."
equivalent = "An allowlist."

